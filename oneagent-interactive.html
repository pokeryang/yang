const NS='http://www.w3.org/2000/svg';
let cur=null,curTab=0,rafs=[],tempPaths=[],tempDots=[];
const ov=()=>document.getElementById('ov');
function inGap(cx,cy,gaps){for(const z of gaps){if(cx>=z[0]&&cx<=z[2]&&cy>=z[1]&&cy<=z[3])return true;}return false;}
function clearAnim(){rafs.forEach(id=>cancelAnimationFrame(id));rafs=[];tempPaths.forEach(p=>p.remove());tempPaths=[];tempDots.forEach(d=>d.remove());tempDots=[];}
function reset(){clearAnim();document.querySelectorAll('.step-btn').forEach(b=>b.classList.remove('active'));document.getElementById('tip').classList.remove('show');}
function makeDot(){const c=document.createElementNS(NS,'circle');c.setAttribute('r','10');c.setAttribute('class','dot active');ov().appendChild(c);tempDots.push(c);return c;}
function buildSegs(d){const parts=d.split(/(?=M\s)/);const segs=[];for(const p of parts){const t=p.trim();if(!t)continue;const el=document.createElementNS(NS,'path');el.setAttribute('d',t);el.setAttribute('class','flow-path active');ov().appendChild(el);tempPaths.push(el);const len=el.getTotalLength();if(len>0.5)segs.push({path:el,len});}return segs;}
function ptAt(segs,dist){let d=dist;for(const s of segs){if(d<=s.len)return s.path.getPointAtLength(d);d-=s.len;}const l=segs[segs.length-1];return l?l.path.getPointAtLength(l.len):null;}
function spd(total,base){return total>1200?Math.max(base,Math.round(total*5/4)):total>600?Math.max(base,Math.round(total*5/2)):Math.max(base,total*5);}
function runLoop(d,dot,gaps,duration,spdMul){const segs=buildSegs(d);const total=segs.reduce((s,x)=>s+x.len,0);const dur=(duration||spd(total,2200))/(spdMul||1);const t0=performance.now();function tick(now){const prog=((now-t0)%dur)/dur;const pt=ptAt(segs,prog*total);if(pt){dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);dot.style.opacity=inGap(pt.x,pt.y,gaps)?'0':'1';}rafs.push(requestAnimationFrame(tick));}rafs.push(requestAnimationFrame(tick));}
function runOnce(d,dot,gaps,duration,onDone){const segs=buildSegs(d);const total=segs.reduce((s,x)=>s+x.len,0);const dur=duration||spd(total,1800);const t0=performance.now();function tick(now){const el=now-t0;if(el>=dur){dot.style.opacity='0';if(onDone)onDone();return;}const pt=ptAt(segs,(el/dur)*total);if(pt){dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);dot.style.opacity=inGap(pt.x,pt.y,gaps)?'0':'1';}rafs.push(requestAnimationFrame(tick));}rafs.push(requestAnimationFrame(tick));}
function runPingPong(fwd,rev,dot,gaps,spdMul){const fs=buildSegs(fwd),rs=buildSegs(rev);const fl=fs.reduce((s,x)=>s+x.len,0),rl=rs.reduce((s,x)=>s+x.len,0),total=fl+rl;const dur=spd(total,3500)/(spdMul||1);const t0=performance.now();function tick(now){let dist=(((now-t0)%dur)/dur)*total,pt;if(dist<=fl)pt=ptAt(fs,dist);else pt=ptAt(rs,dist-fl);if(pt){dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);dot.style.opacity=inGap(pt.x,pt.y,gaps)?'0':'1';}rafs.push(requestAnimationFrame(tick));}rafs.push(requestAnimationFrame(tick));}
function activate(i){reset();cur=i;const step=TABS[curTab].steps[i];const gaps=step.gaps||[];const sf=step.spd||1;
  if(step.mode==='pingpong'){const dot=makeDot();runPingPong(step.fwd,step.rev,dot,gaps,sf);}
  else if(step.mode==='chain'){const dot=makeDot();let ci=0;const pause=400;function chainNext(){tempPaths.forEach(p=>p.remove());tempPaths=[];const d=step.chain[ci];const segs=buildSegs(d);const total=segs.reduce((s,x)=>s+x.len,0);const dur=(step.dur||Math.max(1500,total*8))/sf;const full=dur+pause;const t0=performance.now();function tick(now){const el=now-t0;if(el>=full){ci=(ci+1)%step.chain.length;chainNext();return;}if(el>=dur){dot.style.opacity='0';}else{const pt=ptAt(segs,(el/dur)*total);if(pt){dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);dot.style.opacity=inGap(pt.x,pt.y,gaps)?'0':'1';}}rafs.push(requestAnimationFrame(tick));}rafs.push(requestAnimationFrame(tick));}chainNext();}
  else if(step.mode==='seq'){let done=0;const need=step.once.length;step.once.forEach(d=>{const dot=makeDot();runOnce(d,dot,gaps,null,()=>{if(++done>=need){step.loopAfter.forEach(d2=>{const dt=makeDot();runLoop(d2,dt,gaps,null,sf);});}});});}
  else{step.loop.forEach(d=>{const dot=makeDot();runLoop(d,dot,gaps,null,sf);});}
  const tip=document.getElementById('tip');tip.textContent='步骤'+(i+1)+'：'+step.tip;tip.classList.add('show');
  document.querySelectorAll('.step-btn')[i].classList.add('active');}
function buildPanel(){const t=TABS[curTab];const panel=document.getElementById('panel');let html='<h2>数据流转 '+t.steps.length+' 步 (点击 / ←→键)</h2>';t.steps.forEach((s,idx)=>{html+='<div class="step-btn" data-s="'+idx+'"><span class="sn">'+(idx+1)+'</span><div><div class="sl">'+s.label+'</div><div class="ss">'+s.desc+'</div></div></div>';});panel.innerHTML=html;panel.querySelectorAll('.step-btn').forEach((btn,i)=>{btn.addEventListener('click',()=>{if(cur===i){reset();cur=null;}else activate(i);});});}
function switchTab(ti){curTab=ti;cur=null;reset();document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===ti));document.getElementById('bg').src=TABS[ti].img;buildPanel();setTimeout(()=>activate(0),300);}
function buildTabs(){const bar=document.getElementById('tabs');bar.innerHTML=TABS.map((t,i)=>'<div class="tab">'+t.name+'</div>').join('');bar.querySelectorAll('.tab').forEach((t,i)=>t.addEventListener('click',()=>switchTab(i)));}
document.addEventListener('keydown',e=>{const n=TABS[curTab].steps.length;if(e.key==='ArrowRight'||e.key==='ArrowDown')activate(cur!==null?(cur+1)%n:0);else if(e.key==='ArrowLeft'||e.key==='ArrowUp')activate(cur!==null?(cur+n-1)%n:n-1);});
buildTabs();switchTab(0);
</script>
