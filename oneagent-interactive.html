<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>电商导购Agent架构</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:-apple-system,"PingFang SC","Source Han Sans",sans-serif;height:100vh;display:flex;overflow:hidden;user-select:none}
.main{flex:1;display:flex;padding:6px;gap:8px}
.diagram-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
.diagram-inner{position:relative;width:100%;height:100%}
.bg-img{width:100%;height:100%;object-fit:contain;display:block}
.overlay{position:absolute;top:0;left:0;width:100%;height:100%}
.flow-path{fill:none;stroke:transparent;stroke-width:0;pointer-events:none}
.dot{fill:#4cef60;opacity:0;filter:drop-shadow(0 0 10px #4cef60) drop-shadow(0 0 4px #fff)}
.dot.active{opacity:1}
.flow-path.active{fill:none;stroke:rgba(76,230,100,0.55);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.panel{width:240px;background:#0c0e14;border:1px solid #1e2028;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.panel h2{font-size:12px;color:#666;margin-bottom:4px}
.step-btn{background:#141720;border:1px solid #252830;border-radius:7px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.step-btn:hover{background:#1a1e28;border-color:#444}
.step-btn.active{background:#0f200f;border-color:#4caf50}
.sn{width:20px;height:20px;border-radius:50%;background:#252830;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#888;flex-shrink:0}
.step-btn.active .sn{background:#4caf50;color:#000}
.sl{font-size:11px;color:#bbb}.step-btn.active .sl{color:#fff}
.ss{font-size:9px;color:#555;margin-top:1px}.step-btn.active .ss{color:#8c8}
.tip{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(10,26,10,.94);border:1px solid #4caf50;border-radius:7px;padding:8px 16px;font-size:12px;color:#bfb;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
.tip.show{opacity:1}
</style>
</head>

<div class="panel">
  <h2>数据流转 10 步 (点击 / ←→键)</h2>
  <div class="step-btn" data-s="0"><span class="sn">1</span><div><div class="sl">用户输入</div><div class="ss">用户发出指令注入上下文</div></div></div>
  <div class="step-btn" data-s="1"><span class="sn">2</span><div><div class="sl">加载上下文</div><div class="ss">系统提示词、工具列表、历史对话、状态等与用户指令一起注入上下文</div></div></div>
  <div class="step-btn" data-s="2"><span class="sn">3</span><div><div class="sl">加载Skill</div><div class="ss">大模型根据上下文意图调用相应的Skill</div></div></div>
  <div class="step-btn" data-s="3"><span class="sn">4</span><div><div class="sl">Skill注入上下文</div><div class="ss">Skill内容加载至上下文</div></div></div>
  <div class="step-btn" data-s="4"><span class="sn">5</span><div><div class="sl">RAG知识库</div><div class="ss">大模型根据最新上下文通过RAG方式检索提炼知识库内容</div></div></div>
  <div class="step-btn" data-s="5"><span class="sn">6</span><div><div class="sl">RAG结果注入上下文</div><div class="ss">RAG知识库结果注入上下文</div></div></div>

  <div class="step-btn" data-s="7"><span class="sn">8</span><div><div class="sl">通过接口调用后端服务</div><div class="ss">工具通过接口调用后端服务</div></div></div>
  <div class="step-btn" data-s="8"><span class="sn">9</span><div><div class="sl">返回结果</div><div class="ss">工具调用结果返回上下文</div></div></div>
  <div class="step-btn" data-s="9"><span class="sn">10</span><div><div class="sl">输出回复</div><div class="ss">大模型根据最新上下文输出回复</div></div></div>

<script>
const TIPS=[
  '用户发出指令注入上下文',
  '系统提示词、工具列表、历史对话、状态等与用户指令一起注入上下文',
  '大模型根据上下文意图调用相应的Skill',
  'Skill内容加载至上下文',
  '大模型根据最新上下文通过RAG方式检索提炼知识库内容',
  'RAG知识库结果注入上下文',
  '大模型根据最新上下文通过调度器调用工具',
  '工具通过接口调用后端服务',
  '工具调用结果返回上下文',
  '大模型根据最新上下文输出回复（或调UI Agent等前端渲染能力）',
];

// Text gap zones: [x1,y1,x2,y2] dot hidden when inside
const GAPS={
  1: [[536,748,610,764]],
  3: [[985,1095,1130,1111],[1353,637,1474,653]],
  4: [[1880,637,2242,653],[1309,459,1525,475]],
  5: [[985,1095,1130,1111],[1361,1095,1487,1111]],
  6: [[1309,459,1525,475]],
  7: [[985,1095,1130,1111],[1355,861,1476,877]],
  8: [],
  9: [[1309,459,1525,475]],
  10:[[541,1095,615,1111]],
};

const N=10;let cur=null,rafs=[],tempPaths=[];

function inGap(cx,cy,stepNum){
  const zones=GAPS[stepNum]||[];
  for(let i=0;i<zones.length;i++){
    const z=zones[i];
    if(cx>=z[0]&&cx<=z[2]&&cy>=z[1]&&cy<=z[3])return true;
  }
  return false;
}

function reset(){
  document.querySelectorAll('.flow-path').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d=>{d.classList.remove('active');d.style.opacity='0'});
  document.querySelectorAll('.step-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tip').classList.remove('show');
  rafs.forEach(id=>cancelAnimationFrame(id));rafs=[];
  tempPaths.forEach(p=>p.remove());tempPaths=[];
}

function buildSegs(pathEl){
  const d=pathEl.getAttribute('d');
  const parts=d.split(/(?=M\s*)/);
  const svgNS='http://www.w3.org/2000/svg';
  const segs=[];
  for(const p of parts){
    const trimmed=p.trim();
    if(!trimmed)continue;
    const tmp=document.createElementNS(svgNS,'path');
    tmp.setAttribute('d',trimmed);
    tmp.style.display='none';
    document.querySelector('.overlay').appendChild(tmp);
    tempPaths.push(tmp);
    const len=tmp.getTotalLength();
    if(len>0.5) segs.push({path:tmp,len:len});
  }
  return segs;
}

function animateOnce(pathEl,dotEl,stepNum,duration,onComplete){
  const segs=buildSegs(pathEl);
  const totalLen=segs.reduce((s,seg)=>s+seg.len,0);
  const dur=duration||Math.max(1400,totalLen*1.2);
  const t0=performance.now();
  dotEl.classList.add('active');

  function tick(now){
    const elapsed=now-t0;
    if(elapsed>=dur){
      dotEl.style.opacity='0';
      dotEl.classList.remove('active');
      if(onComplete)onComplete();
      return;
    }
    const progress=elapsed/dur;
    let dist=progress*totalLen;
    let pt=null;
    for(const seg of segs){
      if(dist<=seg.len){pt=seg.path.getPointAtLength(dist);break;}
      dist-=seg.len;
    }
    if(!pt&&segs.length)pt=segs[segs.length-1].path.getPointAtLength(segs[segs.length-1].len);
    if(pt){
      dotEl.setAttribute('cx',pt.x);
      dotEl.setAttribute('cy',pt.y);
      dotEl.style.opacity=inGap(pt.x,pt.y,stepNum)?'0':'1';
    }
    rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}

function animateLoop(pathEl,dotEl,stepNum,duration){
  const segs=buildSegs(pathEl);
  const totalLen=segs.reduce((s,seg)=>s+seg.len,0);
  const dur=duration||Math.max(1800,totalLen*1.2);
  const t0=performance.now();
  dotEl.classList.add('active');

  function tick(now){
    const progress=((now-t0)%dur)/dur;
    let dist=progress*totalLen;
    let pt=null;
    for(const seg of segs){
      if(dist<=seg.len){pt=seg.path.getPointAtLength(dist);break;}
      dist-=seg.len;
    }
    if(!pt&&segs.length)pt=segs[segs.length-1].path.getPointAtLength(segs[segs.length-1].len);
    if(pt){
      dotEl.setAttribute('cx',pt.x);
      dotEl.setAttribute('cy',pt.y);
      dotEl.style.opacity=inGap(pt.x,pt.y,stepNum)?'0':'1';
    }
    rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}

function animatePingPong(fwdEl,revEl,dotEl,stepNum){
  const fwdSegs=buildSegs(fwdEl);
  const revSegs=buildSegs(revEl);
  const fwdLen=fwdSegs.reduce((s,seg)=>s+seg.len,0);
  const revLen=revSegs.reduce((s,seg)=>s+seg.len,0);
  const totalLen=fwdLen+revLen;
  const dur=Math.max(3000,totalLen*1.2);
  const t0=performance.now();
  dotEl.classList.add('active');

  function tick(now){
    const progress=((now-t0)%dur)/dur;
    let dist=progress*totalLen;
    let pt=null;
    if(dist<=fwdLen){
      for(const seg of fwdSegs){
        if(dist<=seg.len){pt=seg.path.getPointAtLength(dist);break;}
        dist-=seg.len;
      }
    } else {
      dist-=fwdLen;
      for(const seg of revSegs){
        if(dist<=seg.len){pt=seg.path.getPointAtLength(dist);break;}
        dist-=seg.len;
      }
    }
    if(!pt){
      const lastSegs=revSegs.length?revSegs:fwdSegs;
      pt=lastSegs[lastSegs.length-1].path.getPointAtLength(lastSegs[lastSegs.length-1].len);
    }
    if(pt){
      dotEl.setAttribute('cx',pt.x);
      dotEl.setAttribute('cy',pt.y);
      dotEl.style.opacity=inGap(pt.x,pt.y,stepNum)?'0':'1';
    }
    rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}

function activate(idx){
  reset();cur=idx;
  const stepNum=idx+1;

  if(stepNum===2){
    // Step 2 分两步：Part A (4 tags 同时走一遍结束) → Part B (上下文→大模型 循环)
    ['p2a','p2b','p2c','p2d','p2e'].forEach(pid=>{
      const p=document.getElementById(pid);
      if(p)p.classList.add('active');
    });
    let doneCount=0;
    const partADone=()=>{
      doneCount++;
      if(doneCount>=4){
        // 4条都走完后，启动 Part B 循环
        animateLoop(document.getElementById('p2e'),document.getElementById('d2e'),stepNum,1600);
      }
    };
    animateOnce(document.getElementById('p2a'),document.getElementById('d2a'),stepNum,1400,partADone);
    animateOnce(document.getElementById('p2b'),document.getElementById('d2b'),stepNum,1400,partADone);
    animateOnce(document.getElementById('p2c'),document.getElementById('d2c'),stepNum,1400,partADone);
    animateOnce(document.getElementById('p2d'),document.getElementById('d2d'),stepNum,1400,partADone);
  } else if(stepNum===8){
    const fwd=document.getElementById('p8');
    const rev=document.getElementById('p8r');
    if(fwd)fwd.classList.add('active');
    if(rev)rev.classList.add('active');
    animatePingPong(fwd,rev,document.getElementById('d8'),stepNum);
  } else {
    const pathEl=document.getElementById('p'+stepNum);
    const dotEl=document.getElementById('d'+stepNum);
    if(!pathEl||!dotEl)return;
    pathEl.classList.add('active');
    animateLoop(pathEl,dotEl,stepNum);
  }

  const tip=document.getElementById('tip');
  tip.textContent='步骤'+stepNum+'：'+TIPS[idx];tip.classList.add('show');
  document.querySelectorAll('.step-btn')[idx].classList.add('active');
}

document.querySelectorAll('.step-btn').forEach((btn,i)=>{
  btn.addEventListener('click',()=>{if(cur===i){reset();cur=null}else activate(i)});
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')activate(cur!==null?(cur+1)%N:0);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')activate(cur!==null?(cur+N-1)%N:N-1);
});
setTimeout(()=>activate(0),400);
</script>
