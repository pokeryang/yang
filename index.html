<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AI 与搜索技术知识图谱</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --bg:#1e1e2e;
    --panel:#252535;
    --panel-2:#2d2d40;
    --text:#e0e0e0;
    --text-dim:#9a9ab0;
    --border:#3a3a52;
    --link:#4a4a6a;
    --link-hi:#8a8acc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif}
  #app{position:relative;width:100vw;height:100vh}
  #graph{position:absolute;inset:0}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg:active{cursor:grabbing}

  .node circle{stroke:#1e1e2e;stroke-width:1.5px;cursor:pointer;transition:stroke .15s,stroke-width .15s}
  .node text{fill:var(--text);font-size:10px;pointer-events:none;text-shadow:0 0 4px #1e1e2e,0 0 2px #1e1e2e}
  .node.large text{font-size:12.5px;font-weight:600}
  .node.huge text{font-size:15px;font-weight:700}
  .node:hover circle{stroke:#fff;stroke-width:2.5px}
  .node.selected circle{stroke:#fff;stroke-width:3px}
  .node.dim{opacity:.12}
  .link{stroke:var(--link);stroke-opacity:.5}
  .link.hi{stroke:var(--link-hi);stroke-opacity:.95}
  .link.dim{stroke-opacity:.04}

  #topbar{position:absolute;top:14px;left:14px;right:360px;display:flex;gap:10px;align-items:center;z-index:5;flex-wrap:wrap}
  #search{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;width:240px;outline:none}
  #search:focus{border-color:var(--link-hi)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--text-dim)}
  .legend .chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);padding:4px 9px;border-radius:99px;cursor:pointer;user-select:none;border:1px solid var(--border)}
  .legend .chip .dot{width:10px;height:10px;border-radius:50%}
  .legend .chip.off{opacity:.35}
  .legend .chip:hover{border-color:var(--link-hi)}

  #sidebar{position:absolute;top:0;right:0;bottom:0;width:340px;background:var(--panel);border-left:1px solid var(--border);padding:24px 22px;overflow-y:auto;z-index:6}
  #sidebar h2{font-size:20px;margin-bottom:4px;color:#fff;font-weight:700;line-height:1.3}
  #sidebar .zh{font-size:14px;color:var(--text-dim);margin-bottom:10px}
  #sidebar .cat{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;color:#fff;margin-bottom:14px;letter-spacing:.3px}
  #sidebar p.desc{font-size:13px;line-height:1.7;color:var(--text);margin-bottom:14px}
  #sidebar p.importance{font-size:12px;color:var(--text-dim);margin:0 0 18px 0;line-height:1.5}
  #sidebar .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  #sidebar .rel-list{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
  #sidebar .rel-list a{background:var(--panel-2);border:1px solid var(--border);padding:7px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12px;cursor:pointer;transition:.15s}
  #sidebar .rel-list a:hover{border-color:var(--link-hi);color:#fff}
  #sidebar .empty{color:var(--text-dim);font-size:13px;margin-top:80px;text-align:center;line-height:1.8}
  #sidebar .empty .big{font-size:18px;color:var(--text);margin-bottom:8px}

  #sidebar .articles{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
  #sidebar .article-card{display:block;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-decoration:none;color:var(--text);transition:.18s;cursor:pointer}
  #sidebar .article-card:hover{border-color:var(--link-hi);background:#34344a;transform:translateY(-1px)}
  #sidebar .article-card .a-title{font-size:13px;font-weight:600;line-height:1.45;margin-bottom:6px;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #sidebar .article-card .a-abs{font-size:11.5px;line-height:1.55;color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #sidebar .article-card .a-link{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:10.5px;color:var(--link-hi);opacity:.75}
  #sidebar .article-card{position:relative}
  #sidebar .article-card .del-btn{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:rgba(40,40,56,.85);border:1px solid var(--border);color:var(--text-dim);font-size:13px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2}
  #sidebar .article-card:hover .del-btn{display:inline-flex}
  #sidebar .article-card .del-btn:hover{color:#ff7e7e;border-color:#ff7e7e;background:rgba(60,30,30,.9)}
  #sidebar .articles-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  #sidebar .articles-head .label{margin-bottom:0}
  #sidebar .add-btn{background:transparent;border:1px solid var(--border);color:var(--link-hi);font-size:11px;padding:3px 9px;border-radius:99px;cursor:pointer;transition:.15s;font-family:inherit}
  #sidebar .add-btn:hover{border-color:var(--link-hi);background:rgba(138,138,204,.12)}
  #sidebar .add-form{display:flex;flex-direction:column;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
  #sidebar .add-form input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;outline:none;font-family:inherit}
  #sidebar .add-form input:focus{border-color:var(--link-hi)}
  #sidebar .add-form .row{display:flex;gap:6px;justify-content:flex-end}
  #sidebar .add-form button{background:var(--link-hi);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:11.5px;cursor:pointer;font-family:inherit}
  #sidebar .add-form button.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
  #sidebar .add-form button:disabled{opacity:.5;cursor:wait}
  #sidebar .add-status{font-size:11px;color:var(--text-dim);line-height:1.4}
  #sidebar .add-status.err{color:#ff7e7e}
  .hint{position:absolute;bottom:14px;left:14px;font-size:11px;color:var(--text-dim);z-index:5;background:rgba(30,30,46,.7);padding:6px 10px;border-radius:6px}
  /* ========== Tabs ========== */
  #tabbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:20;background:var(--panel);border:1px solid var(--border);border-radius:99px;padding:4px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
  #tabbar button{background:transparent;color:var(--text-dim);border:none;padding:7px 20px;border-radius:99px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;font-weight:500}
  #tabbar button:hover{color:var(--text)}
  #tabbar button.active{background:var(--panel-2);color:#fff;box-shadow:0 0 0 1px var(--link-hi) inset}
  .tab-pane{position:absolute;inset:0;display:none;overflow:hidden}
  .tab-pane.active{display:block}
  #tab-graph{background:var(--bg)}
  #tab-graph #topbar{top:60px}

  /* ========== Article Library (Tab 2) ========== */
  #tab-articles{background:var(--bg);overflow-y:auto;padding:70px 40px 60px;display:none}
  #tab-articles.active{display:block}
  .lib-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;max-width:1400px;margin-left:auto;margin-right:auto}
  .lib-head h1{font-size:22px;color:#fff;font-weight:700;letter-spacing:.5px;margin:0}
  .lib-head .lib-count{color:var(--text-dim);font-size:13px}
  .lib-head .spacer{flex:1}
  .lib-head #lib-search{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;width:280px;outline:none;font-family:inherit}
  .lib-head #lib-search:focus{border-color:var(--link-hi)}
  .lib-head #lib-add-btn{background:var(--link-hi);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500}
  .lib-head #lib-add-btn:hover{filter:brightness(1.1)}
  .lib-tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;max-height:140px;overflow-y:auto;padding:2px;max-width:1400px;margin-left:auto;margin-right:auto}
  .lib-tagbar .tag-chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);color:var(--text-dim);padding:4px 11px;border-radius:99px;cursor:pointer;user-select:none;border:1px solid var(--border);font-size:11.5px;transition:.15s}
  .lib-tagbar .tag-chip:hover{border-color:var(--link-hi);color:var(--text)}
  .lib-tagbar .tag-chip.on{background:var(--link-hi);color:#fff;border-color:var(--link-hi)}
  .lib-tagbar .tag-chip .cnt{opacity:.75;font-size:10.5px}
  .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;max-width:1400px;margin:0 auto}
  .lib-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px 12px;position:relative;transition:.18s;display:flex;flex-direction:column}
  .lib-card:hover{border-color:var(--link-hi);transform:translateY(-2px)}
  .lib-card .lc-title{font-size:14px;font-weight:600;line-height:1.5;color:#fff;margin-bottom:8px;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-right:24px}
  .lib-card .lc-title:hover{color:var(--link-hi)}
  .lib-card .lc-abs{font-size:12.5px;line-height:1.65;color:var(--text-dim);flex:1;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .lib-card .lc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  .lib-card .lc-tag{display:inline-block;background:var(--panel-2);color:var(--text);font-size:10.5px;padding:2px 8px;border-radius:99px;cursor:pointer;border:1px solid var(--border);transition:.15s}
  .lib-card .lc-tag:hover{border-color:var(--link-hi);background:#34344a;color:#fff}
  .lib-card .lc-meta{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--text-dim);gap:8px}
  .lib-card .lc-meta .lc-host{opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lib-card .lc-meta .lc-user{color:var(--link-hi);opacity:.85;white-space:nowrap}
  .lib-card .lc-del{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:rgba(40,40,56,.9);border:1px solid var(--border);color:var(--text-dim);font-size:14px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2}
  .lib-card:hover .lc-del{display:inline-flex}
  .lib-card .lc-del:hover{color:#ff7e7e;border-color:#ff7e7e;background:rgba(60,30,30,.9)}
  .lib-empty{text-align:center;color:var(--text-dim);padding:60px 20px;font-size:14px;line-height:1.8;grid-column:1/-1}

  /* ========== Add-Article Modal ========== */
  #lib-add-modal{position:fixed;inset:0;background:rgba(10,10,20,.7);display:none;align-items:flex-start;justify-content:center;z-index:60;padding-top:70px;overflow-y:auto}
  #lib-add-modal.show{display:flex}
  #lib-add-modal .modal-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px 24px;width:540px;max-width:92vw;margin-bottom:40px}
  #lib-add-modal h3{font-size:17px;color:#fff;margin:0 0 4px;font-weight:700}
  #lib-add-modal .modal-sub{font-size:11.5px;color:var(--text-dim);margin-bottom:14px}
  #lib-add-modal label{display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px}
  #lib-add-modal input,#lib-add-modal textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;outline:none;font-family:inherit;box-sizing:border-box}
  #lib-add-modal textarea{min-height:78px;resize:vertical;line-height:1.55}
  #lib-add-modal input:focus,#lib-add-modal textarea:focus{border-color:var(--link-hi)}
  #lib-add-modal .field-hint{font-size:10.5px;color:var(--text-dim);margin-top:4px;line-height:1.5}
  #lib-add-modal .tag-picker{display:flex;flex-wrap:wrap;gap:5px;max-height:180px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px}
  #lib-add-modal .tag-picker .tp-chip{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border);cursor:pointer;user-select:none;transition:.12s}
  #lib-add-modal .tag-picker .tp-chip:hover{color:var(--text)}
  #lib-add-modal .tag-picker .tp-chip.on{background:var(--link-hi);color:#fff;border-color:var(--link-hi)}
  #lib-add-modal .tag-search{margin-bottom:6px;padding:6px 10px;font-size:12px}
  #lib-add-modal .modal-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px}
  #lib-add-modal .modal-footer .left{flex:1;font-size:11.5px;color:var(--text-dim)}
  #lib-add-modal .modal-footer .left.err{color:#ff7e7e}
  #lib-add-modal .modal-footer .btns{display:flex;gap:8px}
  #lib-add-modal .modal-footer button{padding:7px 16px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;border:1px solid var(--border)}
  #lib-add-modal .modal-footer .btn-ghost{background:transparent;color:var(--text-dim)}
  #lib-add-modal .modal-footer .btn-primary{background:var(--link-hi);color:#fff;border-color:var(--link-hi)}
  #lib-add-modal .modal-footer button:disabled{opacity:.5;cursor:wait}

</style>
</head>
<body>

<div id="tabbar">
  <button data-tab="graph" class="active" type="button">关系图谱 · Graph</button>
  <button data-tab="articles" type="button">文章库 · Library</button>
</div>

<div id="tab-graph" class="tab-pane active">
<div id="app">
  <div id="graph"><svg></svg></div>

  <div id="topbar">
    <input id="search" placeholder="搜索概念… 如 Transformer / RAG / MCP / 召回" />
    <div class="legend" id="legend"></div>
  </div>

  <div id="sidebar">
    <div id="sidebar-empty" class="empty">
      <div class="big">AI 与搜索技术知识图谱</div>
      点击任一节点查看解释<br/>
      拖拽 / 滚轮缩放 / 点击图例可筛选分类
    </div>
    <div id="sidebar-content" style="display:none"></div>
  </div>

  <div class="hint">节点大小 = 重要度  ·  颜色 = 分层  ·  单击分类 = 聚焦该层  ·  Shift+ 点 = 多选追加  ·  单击空白 = 退出聚焦  ·  共 <span id="cnt-n"></span> 节点 / <span id="cnt-e"></span> 关系</div>
</div>
</div>

<div id="tab-articles" class="tab-pane">
  <div class="lib-head">
    <h1>文章库</h1>
    <span class="lib-count" id="lib-count">共 0 篇</span>
    <span class="spacer"></span>
    <input id="lib-search" placeholder="搜索标题 / 摘要 / 标签…" autocomplete="off" />
    <button id="lib-add-btn" type="button">＋ 添加文章</button>
  </div>
  <div class="lib-tagbar" id="lib-tagbar"></div>
  <div class="lib-grid" id="lib-grid"></div>
</div>

<div id="lib-add-modal">
  <div class="modal-card">
    <h3 id="lib-add-title-h3">添加文章</h3>
    <div class="modal-sub">填写链接后可点击「自动抓取」获取标题与摘要，也可手动填写。标签从图谱节点中选 1–10 个。</div>

    <label>链接 URL <span style="color:#ff7e7e">*</span></label>
    <input id="lib-add-url" type="url" placeholder="https://…" autocomplete="off" />

    <label>标题</label>
    <input id="lib-add-tit" type="text" placeholder="文章标题（可留空自动抓取）" autocomplete="off" />

    <label>摘要 <span class="field-hint" style="text-transform:none;letter-spacing:0;font-size:10.5px">（80–150 字，留空将自动抓取并裁剪）</span></label>
    <textarea id="lib-add-abs" placeholder="一句话描述这篇文章讲了什么、为什么值得看…"></textarea>

    <label>标签 <span id="lib-add-tagcnt" class="field-hint" style="text-transform:none;letter-spacing:0;font-size:10.5px">（已选 0 / 10）</span></label>
    <input id="lib-add-tagq" class="tag-search" type="text" placeholder="筛选标签…" autocomplete="off" />
    <div class="tag-picker" id="lib-add-tagpicker"></div>

    <div class="modal-footer">
      <div class="left" id="lib-add-status"></div>
      <div class="btns">
        <button type="button" class="btn-ghost" id="lib-add-fetch">自动抓取</button>
        <button type="button" class="btn-ghost" id="lib-add-cancel">取消</button>
        <button type="button" class="btn-primary" id="lib-add-submit">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
const RELATED_ARTICLES = {"articles":[{"id":"art-000","title":"AI原生组织-OpenClaw推动组织形态重塑-甲子智库","url":"https://mp.weixin.qq.com/s/vRSWnA8FWm7b_paATO-yKA","abstract":"甲子光年智库探讨代理式AI时代的新型组织形态——AI原生组织。AI原生组织以AIOS为调度中枢、以Agent为执行单元、以动态协同网络为运行机制。报告分析了OpenClaw从个人AI助手向B端场景的延展，提出AI原生组织的\"五化\"特征（系统接口化、经验资产化、交互意图化、协同流态化、接入凭证化），","tags":["AI","AI Native","API","API Gateway","Compute","Context Window","Deployment","Loop","Node.js","OpenClaw"]},{"id":"art-001","title":"小红书视频笔记-什么是部署？AI工具的最后1公里","url":"https://www.xiaohongshu.com/explore/6a1adba800000000350269b0","abstract":"来源：https://www.xiaohongshu.com/explore/6a1adba800000000350269b0作者：姜学长（清华计算机/AI背景，前华为、阿里达摩院AI专家）时长：约6分10秒类型：科普/教学类视频","tags":["AI","Deployment"]},{"id":"art-002","title":"从UI到AI对话设计：设计师不被淘汰的完整转型路径","url":"https://mp.weixin.qq.com/s/LSOaFg60LBiyosqis_Boew","abstract":"面向UI/交互设计师的AI时代转型指南。文章指出AI不会淘汰设计师，但会淘汰只会画UI的设计师——核心能力正从「界面布局」转向「对话流程设计」与「Agent交互设计」。","tags":["AI"]},{"id":"art-003","title":"写给非算法同学的AI极速入门手册","url":"https://ata.atatech.org/articles/12020373690","abstract":"本文是《5w字长文，我的大模型理解和实践之路》的前传姊妹篇（2025年2月发表，约5.7万字），面向非算法背景的同学系统讲解AI技术演进。全文分为三大部分：1）机器学习（小程序评分场景引入、特征工程、模型选择、训练与评估）；2）深度学习（embedding+MLP范式、推荐系统模型、多模态特征提取）；","tags":["AGI","AI","Attention","BERT","Benchmark","CNN","Compute","DL","Dataset","Decoder"]},{"id":"art-004","title":"关于 AI-Native 组织的思考","url":"https://mp.weixin.qq.com/s/dG0l48XYtUXNZ5iNn621aw","abstract":"作者回顾从24年到25年在组织AI提效上的思考转变：从质疑AI商业价值、到被ClaudeCode点燃、提出\"重新划分工作让Agent全自动搞定90%+子任务\"的激进思路，再到被NotionCEOIvanZhao与BlockCEOJackDorsey的AI-Native组织论影响，","tags":["AI","AI Native"]},{"id":"art-005","title":"本地生活大语言模型应用实践","url":"https://ata.atatech.org/articles/11020175236","abstract":"2022年11月30日，ChatGPT横空出世，OpenAI打开了潘多拉的魔盒，Google为此拉响了红色警报。2023年可谓是通用人工智能（ArtificialGeneralIntelligence，AGI）的元年，大批的行业领袖以及像我一样的互联网搬砖人看到了AGI的可能性。","tags":["AGI","Deployment","Distillation","Embedding","GPT","Ha3","LangChain","Llama","Quantization","Query"]},{"id":"art-006","title":"深度解析 Hermes Agent 如何实现「自进化」及其 Prompt - Context Q1d#/ideaTALK/market/article?articleId=75&marketType=learnCenter","abstract":"原文Agent（智能体）是一个由大语言模型LLM驱动，被授权「替你办事」的智能程序/软件。（理想情况下）你不用手把手教它每一步，你只告诉它一个目标（Goal），它就能自己感知环境（Perceive），自己思考规划（Think），然后自己调用工具（Action）去完成任务。","tags":["API","Agent","Agent Memory","Agentic AI","Alignment","Context","Context Window","DPO","Eval","Executor"]},{"id":"art-023","title":"大模型应用评测实践—IM意图识别评测","url":"https://ata.atatech.org/articles/11020508409","abstract":"本文分享了饿了么IM场景中基于大模型的意图识别评测实践。业务涉及50+种意图分类（如少漏送、食品安全、催单等），技术架构采用四层分流策略：规则快速匹配→NLP意图识别→NLP+向量召回交叉验证→大模型兜底识别。同时介绍了评测集的构建方式（ODPS线上数据清洗）以及裁判测评与指标测评的选型对比。","tags":["Eval","KV Cache","NLP"]},{"id":"art-024","title":"一句话点外卖-闪购Agent的技术发展之路","url":"https://ata.atatech.org/articles/11020591723","abstract":"26年3月3日发表近年来，大模型技术正加速从底层基础能力向规模化应用纵深演进，其价值重心已由“提升内部效率”转向“重塑面向消费者的交互与服务范式”。AI不再仅是辅助工具，而是作为新一代人机接口，深度融入用户决策与交易闭环。","tags":["Agent","Agent Memory","Inference","KV Cache","NLP","Plan-and-Execute","Planner","ReAct","Recall","Streaming"]},{"id":"art-025","title":"浅谈搜索引擎原理","url":"https://ata.atatech.org/articles/11000170265","abstract":"（待补充摘要）不知不觉已经快一年香了，这一年一直在做搜索推荐相关的业务开发，抽空学习了一些搜索引擎技术上的知识，也对搜索推荐业务有了一些个人的理解。搜索推荐业务不同于纯业务开发，也不同于纯技术开发，是一种兼具二者的领域，开发人员一方面需要清楚搜索支撑的业务场景，另一方面也需要明白搜索背后的技术原理，","tags":["BM25","Ha3","Index/Retrieval","Inverted Index","Parameter","TF/DF","Token","Trie"]},{"id":"art-026","title":"你不知道的Claude Code-架构、治理与工程实践","url":"https://ata.atatech.org/articles/11020603220?spm=ata.23639420.0.0.77877536Hc44KQ","abstract":"本文是一篇深度剖析ClaudeCode工程实践的ATA文章（2025年3月发表），作者基于半年深度使用ClaudeCode的经验（两个账号每月40刀），系统性地拆解了ClaudeCode的底层运作机制与高级用法。","tags":["CLI","Hooks","PPO","Plugin","SSE","Sandbox","Subagent","Token","Tool"]},{"id":"art-027","title":"RAG工程实践：分块策略、Rerank、混合检索，这些细节决定效果上限","url":"https://mp.weixin.qq.com/s?__biz=MzE5ODQyNDY4OQ==&mid=2247484860&idx=1&sn=9d5bf6c810d8361bbea7834d8f5ea5c1&chksm=969aa4a2a1ed2db48466ddce3eada3a5612350a47b8b72bb9df3bf596c0388fbb7f427c29ff2&cur_album_id=4438767134088970250&scene=189#wechat_redirect","abstract":"本文深入探讨了将RAG效果从\"能用\"提升到\"好用\"的关键工程细节，包括分块策略、混合检索与Rerank优化。作者指出，分块设计不当会导致召回率低下，而引入Rerank能显著翻倍精准率，这些并非玄学而是可落地的工程实践。","tags":["BM25","Embedding Model","Hybrid Search","Index/Retrieval","LangChain","RAG","Reranker","Semantic Search","Token","Trie"]},{"id":"art-028","title":"如何写好 Skill：一份终极实战经验手册","url":"https://mp.weixin.qq.com/s/SZv3pDXPrL9vwV3Ua_84Kg","abstract":"一份长达4万字的Skill写作终极实战手册，系统沉淀如何从零到一写出能让Agent真正用起来的Skill。覆盖完整流程：识别值得写的Skill场景→SKILL.md的最佳结构（YAMLfrontmatter+触发条件+步骤+示例+验证+反模式）→description怎么写才能被LLM准确触发→…","tags":["API Key","CLI","Client","Few-shot Learning","MCP","MCP Server","SQL","Skill","Tokenizer"]},{"id":"art-029","title":"本地生活意图理解方向FY25财年S1优化概览","url":"https://ata.atatech.org/articles/11020314035?spm=ata.23639746.0.0.33f01e9aRFwn9I","abstract":"原文：https://ata.atatech.org/articles/11020314035?spm=ata.23639746.0.0.33f01e9aRFwn9I","tags":["BERT","Embedding","Vector Search"]},{"id":"art-030","title":"闪购零售搜推精排技术小结","url":"https://ata.atatech.org/articles/11020598006?spm=ata.23639420.0.0.77877536Hc44KQ","abstract":"26年3月6日发表https://ata.atatech.org/articles/11020598006?spm=ata.23639420.0.0.77877536Hc44KQ","tags":["Attention","Hooks","Parameter","Ranking","Router","Scaling Law","Training"]},{"id":"art-031","title":"GenUI 到底难在哪？从设计视角拆解其中的「不可能三角」","url":"https://ata.atatech.org/articles/11020671623","abstract":"GenUI设计视角的「不可能三角」复盘。背景：GenUI让大模型直接输出结构化UI组件描述（A2UI协议JSON）而非纯文本，前端渲染器渲染成可交互界面。主流协议对比VercelAISDK/CopilotKit/A2UI/AG-UI，选A2UI（安全+跨端+开放）。","tags":["AG-UI","Fitting","Generalization","Overfitting","Streaming"]},{"id":"art-032","title":"Skill验证与生命周期-用工程化评估让Skill越用越聪明","url":"https://mp.weixin.qq.com/s/_fxR4PV9IjrMKGRpDkrwZA","abstract":"本文是James的「拆ClaudeCode」系列续篇，聚焦Skill系统的验证与生命周期工程化。从「跑得通≠用得对」的痛点出发，提出Skill验证的三层评估框架（结构验证、指令遵循、效果验收），并讲解如何用LLM-as-Judge、Trace回放、A/B灰度等工程化手段让Skill持续迭代越用越聪明，","tags":["Eval","LLM-as-a-Judge","Skill"]},{"id":"art-033","title":"而今迈步从头越-主搜效率召回探索与优化","url":"https://ata.atatech.org/articles/11020119209?spm=ata.25287382.0.0.679d3901kgYDsj","abstract":"原文地址：https://ata.atatech.org/articles/11020119209?spm=ata.25287382.0.0.679d3901kgYDsj","tags":["Eval","HTTP","ICL","Index/Retrieval","Ranking","Recall","Vector Search"]},{"id":"art-034","title":"Anthropic官方揭秘-Claude四层Prompt结构","url":"https://www.xiaohongshu.com/explore/6a155fe00000000036032176","abstract":"Anthropic应用AI工程师MargotVanLaar在CodewithClaude大会上的演讲，分享了Claude提示词工程的最佳实践。演讲通过两个实际场景展开：一是维护/迁移现有生产prompt时的调试策略，二是从零构建新agent的架构选择。","tags":["Agentic AI","Critic","Hallucination","PPO","Prompt","SSE"]},{"id":"art-035","title":"Anthropic如何管理AI-native工程团队","url":"https://mp.weixin.qq.com/s/Ip3wVHBFDtCha-tCk9zMIQ","abstract":"Anthropic旗下ClaudeCode与Cowork产品线负责人FionaFung在2026年5月CodewithClaude大会上做了一场关于\"如何运营AI-native工程组织\"的28分钟演讲。","tags":["AI Native"]},{"id":"art-036","title":"AI-Native-从超级个体到原生组织","url":"https://mp.weixin.qq.com/s/S3ltsT20dzbBpdgIRDJaWg","abstract":"文章探讨\"AINative\"与\"AI+\"的本质区别：不是\"上了AI\"，而是工作流程从设计之初就按可被Agent调度的方式构建。提出AINative能力四档位（L0尝鲜→L1赋能→L2超级个体→L3AINative），五个改造方向（系统接口化/经验资产化/交互意图化/协同流态化/接入凭证化），","tags":["AI Native","Workflow"]},{"id":"art-037","title":"Stitch：AI生UI测评及工作流研究","url":"https://alidocs.dingtalk.com/i/nodes/AR4GpnMqJzMv7OGpIqk1lP7QVKe0xjE3","abstract":"淘宝闪购零售设计团队对GoogleStitch（AI原生设计工作台，3/18重大升级）的实测评审。定位关系：A2UI是「语言/协议」，Stitch是「说这种语言的App」——AI生成「说明书」，前端按说明书渲染，底层用Gemini多模态推理。","tags":["AG-UI","AI Native","Workflow"]},{"id":"art-038","title":"Harness、Hermes、OpenClaw、Claude Code、MCP、Skill、Agent…到底啥关系？大白话一次全搞懂","url":"https://mp.weixin.qq.com/s/DMzn2kK8FZaYcHDl3IPjqw","abstract":"AI领域新概念层出不穷，Harness、Hermes、MCP、Agent等术语让人眼花缭乱却难以说清其用途。本文将这些零散的概念拼成一张完整的图谱，用大白话讲清楚它们之间的关系与定位，帮助读者建立系统性的理解框架。","tags":["Agent","CLI","Context Window","GPT","Harness","Hermes","MCP","Multi-Agent","OpenClaw","Tool"]},{"id":"art-039","title":"本地生活搜索下的QP零售品店意图识别","url":"https://ata.atatech.org/articles/11020459649?spm=ata.25287382.0.0.44df7536CYs2fg&utm_source=dingtalk&utm_medium=userShare&utm_campaign=055406","abstract":"（待补充摘要）在本地生活搜索业务中，零售搜索以商品意图为主，相关商业策略也主要围绕商品为维度展开。2023年，零售场景推进了\"品带店\"页面展示的优化（如下图所示）。","tags":["BERT","Deployment","Inference"]},{"id":"art-040","title":"既生Function-Call-何生MCP","url":"https://ata.atatech.org/articles/12020406405","abstract":"本文从演进视角深入剖析了大模型交互协议的发展历程（2025年4月发表），探讨了为什么会在FunctionCall之后诞生MCP协议。全文分为四大部分：1）最初的形态——提示词工程（PromptEngineering）及智能体的雏形；2）大模型的能力延伸——FunctionCall工具调用（Ope…","tags":["A2A","API","Client","Function Calling","HTTP","MCP","MCP Server","Prompt Engineering","Reasoning Model","Tool"]},{"id":"art-041","title":"从听懂到懂我-基于大模型的Query智能理解","url":"https://ata.atatech.org/articles/11020520826","abstract":"本文系统介绍了基于大模型的电商Query智能理解体系，涵盖Query改写、扩写、类目预测、核心因子提取、相关搜索和质检六大任务。核心方案基于Qwen3-8B模型，采用\"微调大模型+高质量样本构建+规则后处理\"的协同架构，通过SFT+DPO两阶段训练、多阶段改写链路、","tags":["DPO","Query"]},{"id":"art-042","title":"本地生活搜索-基于LLM的Query改写","url":"https://ata.atatech.org/articles/11020180437?spm=ata.23639746.0.0.20926d39Q55OPg","abstract":"（待补充摘要）Query改写召回在本地生活到家业务搜索中起到了重要的作用，主要用于减少因用户query和商品title之间的差异导致的漏召回问题，例如以下几类case：针对以上问题，我们基于大语言模型（LLM）开发了新的改写链路，在保证一定相关性的基础上，大幅提高了query改写的覆盖，","tags":["Adapter","ICL","Inference","Query","Recall"]},{"id":"art-043","title":"Agent核心技术概念与范式发生了哪些演变以及背后的思考","url":"https://ata.atatech.org/articles/11020644402?spm","abstract":"原文：近几年，随着基模能力的快速升级与迭代，Agent领域迎来了爆发式的增长。特别是近期，像ClaudeCode、Codex、OpenClaw、Hermes等可以说是全新一代的Agent产品和框架在不断涌现，Agent的能力相比早期版本也出现了进一步的跃升，进一步推动了整个Agent生态的繁荣发展。","tags":["Agent Memory","CLI","COT","Context Window","Function Calling","Graph","Hermes","Loop","MCP","RAG"]},{"id":"art-044","title":"Prompt 进阶：Few-shot、CoT、Self-Consistency 三板斧","url":"https://mp.weixin.qq.com/s/MTqKvU27XuHD9M3-RWN7YA","abstract":"系统讲解三种最实用的Prompt进阶技巧：Few-shot（用2-5个示例锚定输出格式与风格）、CoT思维链（让模型显式推理stepbystep，提升复杂逻辑题准确率）、Self-Consistency自洽性（采样多条CoT路径用投票得到稳定答案）。","tags":["COT","Few-shot Learning","Graph","LangChain","LangGraph","Prompt","Self-Consistency","Trie","Zero-shot"]},{"id":"art-045","title":"Skill 的本质——从“会用 AI”到“教会 AI”，为什么 500 行比 1000 行好用","url":"https://mp.weixin.qq.com/s/Oe6OIWJaYrQCqU0PVpZAIg","abstract":"本文是James的「拆ClaudeCode」系列续篇，从工程化视角拆解Skill的本质：Skill不是更长的Prompt，而是把会话散落的「调教AI经验」沉淀为可版本管理、可团队共享、可复用的工程化资产。","tags":["Hooks","ReAct","SQL","Skill"]},{"id":"art-046","title":"Harness 手记二——Harness、Skill、Agent Team、OpenClaw 到底什么关系？读完 Anthropic 最新实验终于想清楚了","url":"https://ata.atatech.org/articles/12020602986?spm=ata.25287382.0.0.4a667536qpEsXR","abstract":"Harness系列第二篇。从读者最高频的三个问题切入：(1)有了Skill为什么还要Harness？(2)OpenClaw是不是Harness的实现？(3)AgentTeam是不是Harness的升级版？作者指出这三个问题背后是同一个认知错位——把不同层次的东西放到同一层比较了。","tags":["Context","Harness","OpenClaw","Plan-and-Execute","Planner"]},{"id":"art-047","title":"喂饭教程｜如何把智能体配置到钉钉群聊里？","url":"https://www.xiaohongshu.com/explore/697d7018000000000903959e","abstract":"一枚卓子的「零代码Agent」接续教程：把阿里云百炼搭好的智能体配置到钉钉群聊作为机器人。流程7步：(1)百炼拿应用ID+APIKey；(2)钉钉开放平台建应用拿ClientID/Secret；(3)卡片平台建AI卡片模板拿模板ID；(4)应用开发开通必要权限；","tags":["API Key","Agent","Client"]},{"id":"art-048","title":"喂饭教程｜零代码开发Agent的全流程","url":"https://www.xiaohongshu.com/explore/696f1e0a000000001a0200c4","abstract":"一枚卓子的零代码Agent开发入门课（前置篇，对应上一篇钉钉接入的「上一支视频」）。用阿里云百炼平台搭外贸报价机器人为例，从4个维度讲透：(1)百炼=一个把模型/知识库/MCP/模板捏在一起的「AI厨房」；(2)为什么自己开发Agent——Manus类通用Agent解决不了企业协作里涉及数据、流程、","tags":["API Key","Agent"]},{"id":"art-049","title":"C端AI提效——自动化生图工作流研究","url":"https://alidocs.dingtalk.com/i/nodes/o14dA3GK8g5ZRkjlHKL0rNMeV9ekBD76","abstract":"淘宝闪购零售设计团队在「外包预算收缩+C端需求偏产品化定制/渠道规范多变」的双重压力下，试跑出来的一个「业务自助、设计师释放」的C端AI深度设计提效工作流。整体定位：让设计师专注核心项目，运营/产品自助完成低价值/突发/批量类视觉需求。","tags":["Workflow"]},{"id":"art-050","title":"Skill 进阶用法-从 Prompt 到可复利资产-关键是把工作流编译出来","url":"https://ata.atatech.org/articles/12020631609","abstract":"最近读GarryTan那篇时，我最大的感受不是“Skill很重要”。这个结论现在已经不新鲜了。大家都知道要写Skill、写AGENTS.md、写项目规则、沉淀操作流程。","tags":["Prompt","Router","Skill","Workflow"]},{"id":"art-051","title":"LangGraph 底层原理：它是怎么把 LLM 变成一台状态机的","url":"https://mp.weixin.qq.com/s/J8IgrW3LgRROLUC8Q5gvZg","abstract":"深入拆解LangGraph框架的底层设计哲学：它本质上不是又一个Agent库，而是把LLM调用编排成「显式状态机」的工程框架。文章对比LangChain链式调用vsLangGraph图式调用的根本差异，讲清节点(Node)、边(Edge)、状态(State)、","tags":["Graph","LangChain","LangGraph","Scheduler","Vector Search"]},{"id":"art-052","title":"面试官坏笑：“你怎么看 Loop Engineering？”我反问：“不就是 -loop 吗？让 Agent 循环干活”，他摇了摇头...","url":"https://mp.weixin.qq.com/s/fhx_Lozs5G-sX11b7wnZgg","abstract":"小林coding解读「LoopEngineering」这个2026年6月新冒出来的概念：从prompt→context→harness→loop是一场瓶颈迁移——模型越强，瓶颈越外移到「亲自按回车的你」。","tags":["Connector","Context","Harness","Loop","Prompt Engineering","Subagent"]},{"id":"art-053","title":"想玩Loop Engineering，可以先从这6个Hook玩法开始","url":"https://mp.weixin.qq.com/s/LVj2foSXi_hBRKxjuYaUyw","abstract":"卡兹克从LoopEngineering的入手点切入，提出Hook是循环最基础的触发器——把规则写死在特定时刻，事件来了Agent自己跑。文章在ClaudeCode现有30个Hook事件里挑出6个高频玩法做实操示范：权限弹窗提醒、开机日程播报、预压缩摘要卡片、文件自动整理（Hook+Skill组合）、","tags":["Loop"]},{"id":"art-054","title":"Multi-Agent的实操与避坑","url":"https://www.xiaohongshu.com/explore/6a30d6fa000000001702c0c5","abstract":"Multi-Agent项目在上下文传递、一致性、调试和调度策略上面临挑战。通过引入结论字段、仲裁层、追踪机制和分级模型，有效缓解了问题。关键在于让系统更可控，确保问题可定位、成本可预期、结果可兜底。","tags":["Multi-Agent"]},{"id":"art-055","title":"Harness 手记一——提示词工程、上下文工程都过时了？Harness Engineering 从原理到实践","url":"https://ata.atatech.org/articles/12020602862?spm=ata.25287382.0.0.4a667536qpEsXR","abstract":"James的HarnessEngineering开篇之作，给出三层框架并配大量生产级案例。核心结论：HarnessEngineering=三层叠加——L1上下文工程（给Agent正确信息）+L2架构约束（机械化把Agent锁在边界里）+L3熵管理（防止系统随时间腐化）。","tags":["Context","Harness","LangChain","Prompt","Prompt Engineering","SSE","Subagent","System Prompt"]},{"id":"art-056","title":"万字-OpenClaw vs Hermes-一文深入拆解两大 Agent 框架","url":"https://mp.weixin.qq.com/s/wPuKUlajb6IaIL3uH7gSAA","abstract":"本文从工程角度深入对比了OpenClaw和HermesAgent两大AIAgent框架。OpenClaw由TypeScript编写，工程化程度高，强调安全、稳定和多层审批，适合生产环境；Hermes由Python编写，核心设计理念是\"闭环学习\"，通过三层提示词引导Agent自主提取技能，追求自我进化。","tags":["Client","Hermes","OpenClaw","Plugin","SQL","Subagent","System Prompt"]},{"id":"art-057","title":"Skill 工程化：模块拆分、MCP 集成、安全底线，写好只是开始","url":"https://mp.weixin.qq.com/s/fi66cNCSJgQwQtzCWqElvw","abstract":"本文是James的「拆ClaudeCode」系列续篇，聚焦Skill从「能写」到「写好」的工程化进阶。讨论三大议题：模块拆分（一个Skill只做一件事，按职责拆分而非按内容堆叠）、MCP集成（Skill调用外部能力时的协议规范与边界设计）、安全底线（权限收敛、Fail-Closed、","tags":["API","API Key","MCP","MCP Server","SQL","Skill"]},{"id":"art-058","title":"从Item到SKU-淘宝主搜排序机制的升级之路","url":"https://ata.atatech.org/articles/11020116015?spm=ata.23639746.0.0.40d144a0OTCw7k","abstract":"本文探讨了淘宝主搜排序机制从Item粒度升级到SKU粒度的技术方案。文章首先论证了SKU粒度建模的合理性——用户进入详情页后基于SKU信息决策购买，且不同SKU价格不同。通过数据分析发现80%商品存在多SKU，40%商品价格有差异。","tags":["HTTP","Ranking"]},{"id":"art-059","title":"零售B端设计工程化协同","url":"https://alidocs.dingtalk.com/i/nodes/ZX6GRezwJl7ZRYAeUrLRrZ5gVdqbropQ","abstract":"淘宝闪购零售设计团队对B端设计工程化的整体规划文档（团队协同分工版）——目标是搭一套「可自闭环、可持续迭代优化、可插拔」的设计工程化体系，核心由InputHarness（需求增强+结构化输出PRD）→ProcessHarness（护栏注入+资产库引用spec→生码Agent合规生产code）→F…","tags":["Guardrail"]},{"id":"art-060","title":"Hooks 让 Claude Code 一定按规矩来","url":"https://www.xiaohongshu.com/explore/6a044361000000003601ab0e","abstract":"Anthropic官方ClaudeCode入门教程第N集（中译版），讲Hooks机制：让你在ClaudeCode运行周期的不同节点（UserPromptSubmit/PreToolUse/PostToolUse/Notification/Stop）挂自定义命令。","tags":["Hooks"]},{"id":"art-061","title":"深入搜索引擎原理","url":"https://ata.atatech.org/articles/11000126558","abstract":"（待补充摘要）这里有个概念需要提一下。信息检索(InformationRetrieval简称IR)和搜索(Search)是有区别的，信息检索是一门学科，研究信息的获取、表示、存储、组织和访问，而搜索只是信息检索的一个分支，其他的如问答系统、信息抽取、信息过滤也可以是信息检索。","tags":["BM25","Index/Retrieval","Inverted Index","SQL","TF/DF","Trie"]},{"id":"art-062","title":"大模型元年-饿了么搜索的技术探索与变革","url":"https://ata.atatech.org/articles/11020199233","abstract":"本文是饿了么搜索团队在2023年（大模型元年）的年度技术总结（2024年2月发表），全面回顾了团队在搜索业务上的探索与变革。全文分为四大部分：1）背景（饿了么搜索业务介绍、阶段性业务结果——订单+26.7%/净G+15.9%/DAU+12.9%）；2）策略拆解（1+7目标体系、","tags":["Index/Retrieval","LLM","Query","Ranking","Recall"]},{"id":"art-063","title":"AI Native 组织的本质，不是用 AI 提效，而是重写公司怎么运转","url":"https://mp.weixin.qq.com/s/9yuY_CsLyTdMTH3vwv0HAQ","abstract":"区分「AI in Company」与「AI Native」：前者把 AI 当加速器塞进旧流程，组织运转方式不变；后者把 AI 放进公司底层逻辑，形成「感知—判断—行动—反馈—学习」的智能自循环。AI 是放大器而非纠错器，会放大组织既有的优点与疮疤，因此转型本质不是上工具而是组织重构，最难的是人机决策权、行动权与责任边界的重新设计。","tags":["AI","AI Native","Agent","Agentic AI","Workflow"]},{"id":"art-064","title":"Codex这个收尾习惯一定要养成","url":"https://www.xiaohongshu.   {id:"Parameter", zh:"参数", cat:"foundation", size:4, desc:"Parameter。神经网络的可训练权重总量，如 7B、70B、671B，是衡量模型规模的核心指标，直接影响算力、显存与表达能力。"},
  {id:"Compute", zh:"算力", cat:"foundation", size:3, desc:"Compute。训练与推理消耗的 GPU/TPU FLOPs 总量，与参数量、数据量同为 Scaling Law 三要素，直接决定模型上限与商业成本。"},
  {id:"Dataset", zh:"数据集", cat:"foundation", size:3, desc:"Dataset。用于训练、微调、评测的样本集合，规模、质量、分布共同决定模型上限；CommonCrawl、The Pile、ShareGPT 是常见来源。"},
  {id:"Vectorization", zh:"向量化", cat:"foundation", size:2, desc:"Vectorization。把原始对象如文本、图像、用户行为经模型映射为向量的过程，是 RAG、推荐、语义搜索的标准入口动作。"},
  {id:"Generalization", zh:"泛化", cat:"foundation", size:3, desc:"Generalization。模型在未见过样本上仍保持良好表现的能力，是机器学习的核心目标；过拟合与欠拟合都是泛化失败的两种典型表现。"},
  {id:"Fitting", zh:"拟合", cat:"foundation", size:2, desc:"Fitting。模型对训练数据的逼近程度，欠拟合学不到规律、过拟合记住噪声位于两端，理想状态是兼顾训练误差与泛化误差。"},
  {id:"Overfitting", zh:"过拟合", cat:"foundation", size:2, desc:"Overfitting。模型在训练集表现优秀但在测试集明显下降，记住了噪声而非规律；可通过正则化、数据增广、早停、dropout 缓解。"},
  {id:"Underfitting", zh:"欠拟合", cat:"foundation", size:1, desc:"Underfitting。模型容量不足或训练不充分，在训练集都表现不好，无法捕捉数据规律；通常需要加深网络、延长训练、提升数据质量。"},
  {id:"Scaling Law", zh:"缩放定律", cat:"foundation", size:3, desc:"Scaling Law。OpenAI 与 DeepMind 实证发现损失随参数量、数据量、算力按幂律下降，是大模型『大力出奇迹』背后的核心理论基础。"},
  {id:"Emergence", zh:"涌现", cat:"foundation", size:3, desc:"Emergent Ability。模型规模达到临界点后突然出现的新能力，如 CoT、ICL、指令遵循，是大模型区别于传统 ML 的核心现象。"},
  {id:"Benchmark", zh:"基准评测", cat:"foundation", size:3, desc:"Benchmark。MMLU、GSM8K、SWE-Bench、HumanEval 等标准化测试集，是不同模型横向对比的事实标尺与版本迭代的硬指标。"},
  {id:"Eval", zh:"评测", cat:"foundation", size:3, desc:"Evaluation。系统化衡量模型与 Agent 输出质量的工程，涵盖离线基准、在线 A/B、人工评审、LLM-as-a-Judge，是 LLM 产品闭环的最后一环。"},
  {id:"LLM-as-a-Judge", zh:"大模型评审", cat:"foundation", size:1, desc:"LLM-as-a-Judge。用强模型扮演评委对其他模型输出打分，规模化替代人工评测；需关注位置偏差、长度偏差与一致性 Kappa。"},
  {id:"Alignment", zh:"对齐", cat:"foundation", size:4, desc:"Alignment。让模型行为符合人类意图与价值观的研究方向，RLHF、DPO、Constitutional AI 都是主流对齐手段，是 LLM 落地的安全底线。"},
  {id:"Hallucination", zh:"幻觉", cat:"foundation", size:2, desc:"Hallucination。模型一本正经地编造事实，是 LLM 的核心顽疾；RAG、工具调用、引用机制与事实校验是常见缓解方案。"},
  {id:"AI Native", zh:"AI 原生", cat:"foundation", size:2, desc:"AI Native。从产品形态、组织结构到工程流程都围绕 AI 重新设计，而不是在旧产品上加一个按钮，强调以 LLM 与 Agent 为第一公民。"},

  /* ========== 模型架构 Model Arch ========== */
  {id:"CNN", zh:"卷积神经网络", cat:"model_arch", size:2, desc:"Convolutional Neural Network。通过卷积核滑动提取局部特征，在 Transformer 之前是图像分类、目标检测与序列建模的主力架构。"},
  {id:"RNN", zh:"循环神经网络", cat:"model_arch", size:2, desc:"Recurrent Neural Network。按时序逐步处理序列，曾用于翻译与语音；存在梯度消失与无法并行的问题，已被 Transformer 取代。"},
  {id:"Transformer", zh:"Transformer 架构", cat:"model_arch", size:5, desc:"Transformer。2017 年 Google《Attention Is All You Need》提出，用 Self-Attention 替代 RNN，是几乎所有现代大模型的共同基础。"},
  {id:"Attention", zh:"注意力机制", cat:"model_arch", size:1, desc:"Attention。动态地为输入的不同位置分配权重，让模型有侧重地处理信息，是 Transformer 与现代深度学习的核心通用操作。"},
  {id:"Self-Attention", zh:"自注意力", cat:"model_arch", size:1, desc:"Self-Attention。序列中每个 token 与所有 token 计算相关性权重，从而捕捉长距离依赖，是 Transformer 编码器与解码器的核心计算单元。"},
  {id:"Encoder", zh:"编码器", cat:"model_arch", size:1, desc:"Encoder。把输入序列压缩成上下文向量表示，BERT 是纯 Encoder 架构，擅长理解、检索、分类等判别式任务，常作为向量化底座。"},
  {id:"Decoder", zh:"解码器", cat:"model_arch", size:1, desc:"Decoder。基于已有上下文逐 token 自回归生成，GPT 系列是纯 Decoder 架构，擅长对话、写作、代码补全等生成式任务。"},
  {id:"MoE", zh:"混合专家", cat:"model_arch", size:2, desc:"Mixture of Experts。每个 token 只激活部分专家子网络，可在不增加推理算力的前提下扩大参数量，Mixtral、DeepSeek-V3 是代表。"},
  {id:"Diffusion Model", zh:"扩散模型", cat:"model_arch", size:2, desc:"Diffusion Model。通过加噪与去噪两阶段学习数据分布，Stable Diffusion、DALL·E、Sora 等图像与视频生成模型都基于此范式。"},
  {id:"GAN", zh:"生成对抗网络", cat:"model_arch", size:2, desc:"Generative Adversarial Network。生成器与判别器对抗训练，曾是图像生成的主流范式，现已被扩散模型在质量与稳定性上全面取代。"},
  {id:"VAE", zh:"变分自编码器", cat:"model_arch", size:3, desc:"Variational Autoencoder。学习数据的连续隐空间分布，可用于生成与表征学习；VQ-VAE、RQ-VAE 是它的离散量化变体。"},
  {id:"GPT", zh:"GPT 系列", cat:"model_arch", size:2, desc:"Generative Pre-trained Transformer。OpenAI 的 Decoder-only 大模型系列，自 GPT-3 起引爆通用大模型时代，是闭源旗舰路线代表。"},
  {id:"Llama", zh:"Llama 开源系列", cat:"model_arch", size:2, desc:"Llama。Meta 开源的大模型系列，从 Llama 1 到 Llama 3 推动整个开源生态，是企业私有化部署与学术研究的事实标准底座。"},
  {id:"BERT", zh:"BERT 模型", cat:"model_arch", size:3, desc:"BERT。Google 2018 年的双向 Encoder 模型，把搜索、排序、问答从关键词时代推进到语义时代，至今仍是检索向量化常用的底座。"},
  {id:"CV Foundation Model", zh:"CV 大模型", cat:"model_arch", size:1, desc:"CV Foundation Model。视觉领域的大规模预训练通用模型，如 SAM、DINOv2、Florence，可零样本迁移到检测分割，也是多模态视觉骨干。"},
  {id:"Embedding Model", zh:"嵌入模型", cat:"model_arch", size:3, desc:"Embedding Model。专门把文本、图像、代码映射为向量的模型，如 OpenAI text-embedding-3、bge、jina，是 RAG 与向量数据库的核心组件。"},
  {id:"Reasoning Model", zh:"推理模型", cat:"model_arch", size:3, desc:"Reasoning Model。o1、o3、DeepSeek-R1 一类专门为长链思维优化的模型，通过 RL 训练让模型在回答前长时间内部推理，数学与代码任务大幅提升。"},
  {id:"HSTU", zh:"HSTU 架构", cat:"model_arch", size:1, desc:"Hierarchical Sequential Transduction Unit。Meta 2024 提出，把推荐重构成生成式序列建模任务的统一架构，是 Transformer 在推荐场景的产物。"},
  {id:"VQ-VAE", zh:"向量量化 VAE", cat:"model_arch", size:1, desc:"Vector Quantized VAE。用离散码本把连续 Embedding 量化成 token，是生成式推荐与多模态 Tokenizer 的核心组件，便于自回归生成。"},
  {id:"RQ-VAE", zh:"残差量化 VAE", cat:"model_arch", size:1, desc:"Residual Quantized VAE。用多层残差量化逐层逼近原向量，得到层次化 semantic id，是 TIGER 等生成式推荐工作的基础组件。"},

  /* ========== 模型训练 Training ========== */
  {id:"Training", zh:"训练", cat:"training", size:3, desc:"Training。让模型从数据中学习参数权重的过程，是机器学习生命周期的核心阶段；LLM 通常分预训练（Pre-training）与后训练（Post-training）两大阶段，后训练下又细分 SFT、RLHF、DPO 等。"},
  {id:"Fine-tuning", zh:"微调", cat:"training", size:3, desc:"Fine-tuning。在预训练模型基础上用少量任务或领域数据继续训练，使其适配特定场景；SFT、LoRA、DPO 都属于微调范畴。"},
  {id:"Pre-training", zh:"预训练", cat:"training", size:4, desc:"Pre-training。在海量无标注语料上做自监督学习如下一 token 预测，让模型获得通用语言与世界知识，是大模型能力的根基。"},
  {id:"Continual Pretrain", zh:"持续预训练", cat:"training", size:1, desc:"Continual Pretrain。在已预训练的基模型上继续灌入新领域语料，让模型低成本适配垂直领域，无需从零训练，是企业定制常用手段。"},
  {id:"Post-training", zh:"后训练", cat:"training", size:4, desc:"Post-training。预训练完成后为让基模型对齐到指令遵循、人类偏好与安全边界而进行的一系列训练阶段的统称，涵盖 SFT、RLHF、DPO、PPO、Constitutional AI 等；是从『会补全』走向『会对话/会做事』的关键改造，也是当代对齐工程的主战场。"},
  {id:"SFT", zh:"有监督微调", cat:"training", size:4, desc:"Supervised Fine-Tuning。用人写的『指令-回答』样本训练模型，使其学会按指令格式作答，是从基模型走向可用对话模型的关键一步，属于后训练的第一阶段。"},
  {id:"RLHF", zh:"人类反馈强化学习", cat:"training", size:4, desc:"Reinforcement Learning from Human Feedback。用人类对模型输出的偏好排序训练奖励模型，再用 RL 优化策略，是 ChatGPT 出圈的关键技术。"},
  {id:"DPO", zh:"直接偏好优化", cat:"training", size:2, desc:"Direct Preference Optimization。跳过奖励模型直接用偏好对优化策略，相比 PPO 更简洁稳定、训练成本低，是当下偏好对齐的主流选择。"},
  {id:"PPO", zh:"近端策略优化", cat:"training", size:1, desc:"Proximal Policy Optimization。OpenAI 提出的策略梯度算法，通过限制策略更新幅度提升稳定性，是 RLHF 与 RL 训练中最常用的优化器。"},
  {id:"PEFT", zh:"参数高效微调", cat:"training", size:3, desc:"Parameter-Efficient Fine-Tuning。冻结大模型主权重、只训练极少量新增参数就能让模型适配下游任务的微调范式统称，代表方法有 LoRA、QLoRA、Adapter、Prefix Tuning、Prompt Tuning；相比全参数微调显存占用降 1-2 个数量级、可插拔切换任务，是企业定制与端侧微调的默认方案。"},
  {id:"LoRA", zh:"低秩适配", cat:"training", size:2, desc:"Low-Rank Adaptation。冻结大模型主权重，只训练插入的低秩矩阵，显存与存储开销极小，是最流行的参数高效微调 PEFT 方法。"},
  {id:"RL", zh:"强化学习", cat:"training", size:4, desc:"Reinforcement Learning。通过环境反馈的奖励信号迭代优化策略；在 LLM 中既用于对齐 RLHF，也用于推理模型与 Agent 的自我改进。"},
  {id:"Distillation", zh:"知识蒸馏", cat:"training", size:2, desc:"Knowledge Distillation。用大模型作教师的输出训练小模型作学生，把大模型能力压缩到推理更便宜的小模型上，是端侧部署常用技术。"},
  {id:"Quantization", zh:"量化", cat:"training", size:3, desc:"Quantization。把模型权重从 FP16 压缩到 INT8、INT4 等低精度，显存与延迟大幅下降，是端侧部署与推理优化的关键技术。"},
  {id:"Reward Model", zh:"奖励模型", cat:"training", size:1, desc:"Reward Model。用人类偏好数据训练的打分器，对模型输出打分作为 RL 的奖励信号，是 RLHF 流水线中介于偏好数据与策略优化之间的关键中间件。"},
  {id:"Constitutional AI", zh:"宪法式 AI", cat:"training", size:2, desc:"Constitutional AI。Anthropic 提出的对齐方法，让模型按一组成文原则进行自我批评与修正，减少对人工偏好标注的依赖。"},

  /* ========== 模型推理 Reasoning ========== */
  {id:"Inference", zh:"推理", cat:"reasoning", size:5, desc:"Inference。模型上线后接受输入并产出输出的过程，与训练相对；推理优化是大模型规模化落地成本与延迟的核心战场。"},
  {id:"Context Window", zh:"上下文窗口", cat:"reasoning", size:3, desc:"Context Window。模型一次能容纳的 token 上限，如 8K、128K、1M；窗口越长越能处理长文档与长对话，但显存与延迟同步上升。"},
  {id:"Streaming", zh:"流式输出", cat:"reasoning", size:1, desc:"Streaming。模型边生成边返回 token，前端逐字显示，显著提升交互响应感与可用性；通常用 SSE 或 WebSocket 承载。"},
  {id:"Inference Engine", zh:"推理引擎", cat:"reasoning", size:3, desc:"Inference Engine。专为 LLM 推理优化的运行时，如 vLLM、SGLang、TensorRT-LLM、TGI，通过 PagedAttention、批调度、量化把吞吐与延迟压到极致。"},
  {id:"KV Cache", zh:"KV 缓存", cat:"reasoning", size:2, desc:"KV Cache。Transformer 推理时缓存历史 token 的 Key 与 Value 张量，避免重复计算；是长上下文与流式生成提速的核心机制。"},
  {id:"COT", zh:"思维链", cat:"reasoning", size:4, desc:"Chain of Thought。让模型在给答案之前显式写出『思考步骤』，显著提升数学、代码与多跳推理题的准确率，是 Prompt 工程基础技巧。"},
  {id:"Few-shot Learning", zh:"少样本学习", cat:"reasoning", size:2, desc:"Few-shot Learning。在 prompt 中给几条示例，模型不更新参数也能学会新任务，是 LLM 上下文学习能力的具体体现。"},
  {id:"Zero-shot", zh:"零样本", cat:"reasoning", size:1, desc:"Zero-shot。不给任何示例，仅靠自然语言指令让模型完成任务，体现 LLM 的指令泛化能力，是大模型『开箱即用』的基础。"},
  {id:"ICL", zh:"上下文学习", cat:"reasoning", size:2, desc:"In-Context Learning。模型仅通过 prompt 中的示例与指令完成新任务而不更新权重，是 LLM 区别于传统 ML 的关键能力，催生 Prompt 工程。"},
  {id:"Self-Consistency", zh:"自一致性", cat:"reasoning", size:1, desc:"Self-Consistency。让模型采样多条 CoT 路径，对最终答案投票或多数表决，比单条 CoT 更稳健，是数学题与逻辑题的提分利器。"},
  {id:"ReAct", zh:"ReAct 范式", cat:"reasoning", size:4, desc:"Reasoning + Acting。让模型交替输出『Thought / Action / Observation』，把推理与工具调用结合，是最经典也最广泛使用的 Agent 范式。"},
  {id:"Plan-and-Execute", zh:"先规划后执行", cat:"reasoning", size:1, desc:"Plan-and-Execute。先一次性规划全部步骤再依次执行，相比 ReAct 节省 token、长任务更可控，但应对意外能力较低，常与回退结合使用。"},
  {id:"Reflexion", zh:"自我反思", cat:"reasoning", size:1, desc:"Reflexion。让 Agent 在失败后写一段反思放回上下文，下一轮基于反思重新尝试，是一种简单有效、几乎零成本的 Agent 自我改进机制。"},
  {id:"Long Thinking", zh:"长思考", cat:"reasoning", size:2, desc:"Long Thinking。又称 Test-Time Compute，在推理阶段花更多 token 内部思考如 o1、R1 范式，用算力换正确率，是推理模型的标志性运行模式。"},

  /* ========== Agent 架构 Architecture ========== */
  {id:"Agent", zh:"智能体", cat:"agent_arch", size:5, desc:"Agent。具备感知、规划、调用工具、与环境交互能力的自主程序；在 LLM 时代特指以大模型为大脑、能持续完成任务的系统。"},
  {id:"Agentic AI", zh:"智能体型 AI", cat:"agent_arch", size:4, desc:"Agentic AI。具备自主规划、调用工具、与环境长期交互能力的 AI；从『会聊』走向『会做事』，是 2024 年起的产业主线。"},
  {id:"Workflow", zh:"工作流", cat:"agent_arch", size:2, desc:"Workflow。把任务拆成固定节点和边按预定义路径执行，可控性强但灵活性弱；是 Agent 落地中与 Graph、Loop 并列的编排范式之一。"},
  {id:"Graph", zh:"图结构", cat:"agent_arch", size:2, desc:"Graph。把 Agent 编排成节点与边的有向图（可有环），是 LangGraph 等现代框架的核心抽象，支持条件分支、循环、检查点恢复。"},
  {id:"Loop", zh:"循环", cat:"agent_arch", size:4, desc:"Loop。Agent 的核心运行模式——观察、思考、行动、再观察反复迭代，所有 Agent 框架本质都是 Loop 的不同封装与策略。"},
  {id:"Multi-Agent", zh:"多智能体", cat:"agent_arch", size:4, desc:"Multi-Agent。多个角色化的 Agent 分工合作如 PM、工程师、QA，通过消息或共享状态完成复杂任务，是模拟人类团队协作的范式。"},
  {id:"Subagent", zh:"子智能体", cat:"agent_arch", size:1, desc:"Subagent。主 Agent 拆出独立上下文窗口的从属 Agent，用于并行探索、隔离长任务、隐藏冗余上下文；Claude Code、Qoder 都内置此机制。"},
  {id:"Planner", zh:"规划器", cat:"agent_arch", size:1, desc:"Planner。负责拆解任务、产出子目标和执行计划，是多 Agent 系统的『大脑』；常与 Executor、Critic 配合完成长链路自动化。"},
  {id:"Router", zh:"路由器", cat:"agent_arch", size:1, desc:"Router。决定下一步选哪个工具、哪条分支、哪个下游 Agent，是 Agent 编排的关键控制点；通常由 LLM 或规则共同实现。"},
  {id:"Executor", zh:"执行器", cat:"agent_arch", size:1, desc:"Executor。真正调用工具、API、代码完成动作并把结果回写到状态，是 Agent 与外部世界发生关系的执行末端。"},
  {id:"Critic", zh:"评审器", cat:"agent_arch", size:2, desc:"Critic。审查执行结果是否满足目标、是否需要回滚或重试，常用于 Reflexion 与自我修复链路，是质量保障的关键节点。"},
  {id:"Scheduler", zh:"调度器", cat:"agent_arch", size:1, desc:"Scheduler。决定多个待执行节点的运行顺序与并发策略，LangGraph、CrewAI 都内置调度器；并行调度能显著缩短长链任务耗时。"},
  {id:"Agent Memory", zh:"Agent 记忆", cat:"agent_arch", size:3, desc:"Agent Memory。Agent 跨会话保留信息的机制总称，短期放进 Context Window、长期存向量库或知识图谱按需检索，决定 Agent 能否越用越懂你。"},
  {id:"HITL", zh:"人在回路", cat:"agent_arch", size:2, desc:"Human-in-the-Loop。在 Agent 自动链路的关键节点引入人审、确认、接管，平衡自动化效率与可控性，是企业级 Agent 落地的关键设计。"},
  {id:"LangChain", zh:"LangChain", cat:"agent_arch", size:3, desc:"LangChain。最早流行的 LLM 应用框架：链式组合 prompt、工具、记忆与检索器，生态丰富但被诟病抽象过重、调试困难。"},
  {id:"LangGraph", zh:"LangGraph", cat:"agent_arch", size:2, desc:"LangGraph。LangChain 团队推出的图结构 Agent 框架，支持循环、条件边、检查点、人类介入与流式输出，是当前主流选择之一。"},
  {id:"OpenClaw", zh:"OpenClaw", cat:"agent_arch", size:3, desc:"OpenClaw。开源的 Agent 运行时框架，提供 Agent Loop、Tool、Hook、State 等基础抽象，被多个产品用作底座，强调可扩展性。"},
  {id:"Hermes", zh:"Hermes", cat:"agent_arch", size:2, desc:"Hermes。另一款 Agent 运行时框架，提供 Agent Loop、Tool、Hook 等基础抽象，与 OpenClaw 路线相近，定位轻量级嵌入。"},

  /* ========== 协议接口 Protocol ========== */
  {id:"MCP", zh:"模型上下文协议", cat:"protocol", size:5, desc:"Model Context Protocol。Anthropic 牵头的开放协议，让 LLM 以统一方式接入外部工具与数据源，被誉为 AI 时代的 USB-C 接口标准。"},
  {id:"MCP Server", zh:"MCP 服务端", cat:"protocol", size:2, desc:"MCP Server。对外暴露工具、资源、Prompt 的服务进程，被 Agent 的 MCP Client 发现并调用；钉钉、GitHub、Slack 均已提供官方 MCP Server。"},
  {id:"MCP Client", zh:"MCP 客户端", cat:"protocol", size:2, desc:"MCP Client。运行在 Agent 一侧，负责发现 MCP Server、协商能力、调用工具并把结果回传给模型，是 MCP 协议的发起方角色。"},
  {id:"A2A", zh:"Agent-to-Agent 协议", cat:"protocol", size:2, desc:"A2A。Google 牵头的 Agent 间互操作协议，让不同厂商团队的 Agent 互相发现身份、能力与任务，与 MCP、AG-UI 并列为 Agent 三大协议。"},
  {id:"AG-UI", zh:"Agent-to-User UI 协议", cat:"protocol", size:1, desc:"AG-UI。Agent 与前端、终端用户之间的事件与 UI 协议，统一流式 token、工具状态、生成式 UI 的回传通道，与 A2UI 同源演进。"},
  {id:"Function Calling", zh:"函数调用", cat:"protocol", size:2, desc:"Function Calling。模型输出结构化 JSON 指明要调哪个函数与参数，调用方执行后把结果回灌；OpenAI、Anthropic 的 Tool use 都归入此模式。"},
  {id:"Tool", zh:"工具", cat:"protocol", size:5, desc:"Tool。暴露给 Agent 调用的外部能力如搜索、计算器、SQL、浏览器、文件系统等；Tool use 是 Agent 与世界交互的基本方式。"},
  {id:"API", zh:"API 应用接口", cat:"protocol", size:4, desc:"Application Programming Interface。服务对外暴露的契约，Agent 通过 API 拿数据、做动作，是软件互操作与 Tool 实现的底层基础。"},
  {id:"API Gateway", zh:"API 网关", cat:"protocol", size:2, desc:"API Gateway。位于客户端与后端服务之间的统一入口，集中负责路由、鉴权、限流、熔断、日志与协议转换，是 Agent 工具的标准前置层。"},
  {id:"API Key", zh:"API 密钥", cat:"protocol", size:2, desc:"API Key。调用 API 时用于身份识别的字符串令牌如 sk-xxxx，通常放在请求头或环境变量；轻量但一旦泄露权限会被滥用，须严格保密。"},
  {id:"AccessKey", zh:"AccessKey", cat:"protocol", size:1, desc:"AccessKey。云厂商颁发的身份凭证对 AK ID + AK Secret，用 HMAC 签名请求；权限范围远超普通 API Key，必须配合 RAM、STS 收敛权限。"},
  {id:"Client", zh:"客户端", cat:"protocol", size:3, desc:"Client。发起 API、RPC、MCP 请求的一方；在 MCP 协议里 Client 由 Agent 持有，负责连接 Server、协商能力、调用工具的全流程。"},
  {id:"SDK", zh:"SDK 软件开发包", cat:"protocol", size:2, desc:"Software Development Kit。把 API 封装成易用的语言库降低集成门槛，常提供类型签名、重试、流式处理、错误归一化等开箱能力。"},
  {id:"CLI", zh:"CLI 命令行界面", cat:"protocol", size:2, desc:"Command Line Interface。Agent 与系统交互最强大的入口（文件、git、shell、ssh），Claude Code 等产品的核心通道，本质是一种文本工具。"},
  {id:"Slash Command", zh:"斜杠命令", cat:"protocol", size:1, desc:"Slash Command。以『/cmd』形式在对话框触发预定义 Agent 动作的入口范式，Claude Code、Cursor、Qoder、Slack 普遍采用此交互。"},
  {id:"SSE", zh:"SSE 服务端推送", cat:"protocol", size:1, desc:"Server-Sent Events。基于 HTTP 的服务端单向流式推送协议，连接简单、断线重连友好，是 LLM 流式输出最常用的传输方式。"},
  {id:"HTTP", zh:"HTTP 协议", cat:"protocol", size:2, desc:"HyperText Transfer Protocol。Web、API、MCP 远程模式的底层传输协议，约定请求与响应的格式、状态码、头部、缓存与认证语义。"},
  {id:"Computer Use", zh:"计算机使用", cat:"protocol", size:2, desc:"Computer Use。让 Agent 像人一样操作鼠标键盘、读取屏幕截图来完成任务，Anthropic 与 OpenAI 分别推出 Computer Use 与 Operator 实现。"},
  {id:"Browser Use", zh:"浏览器使用", cat:"protocol", size:1, desc:"Browser Use。让 Agent 自主驾驶浏览器完成点击、表单填充、滚动、抓取等网页任务，是 Computer Use 的网页子集，已被广泛集成。"},

  /* ========== 工程组件 Engineering ========== */
  {id:"Prompt", zh:"提示词", cat:"engineering", size:4, desc:"Prompt。给模型的指令文本，决定模型输出的质量、风格与边界；Prompt 工程是 LLM 落地的第一门功课，也是产品差异化关键。"},
  {id:"System Prompt", zh:"系统提示词", cat:"engineering", size:1, desc:"System Prompt。模型对话的顶层指令（角色、规范、工具说明、安全约束），权重高于用户消息，是 Agent 人格与能力边界的承载体。"},
  {id:"Prompt Engineering", zh:"提示词工程", cat:"engineering", size:2, desc:"Prompt Engineering。系统化设计、迭代、评测 Prompt 的方法论，覆盖角色设定、Few-shot、CoT、结构化输出、安全防护，是 LLM 应用首门学科。"},
  {id:"Prompt Template", zh:"提示词模板", cat:"engineering", size:2, desc:"Prompt Template。带变量占位的可复用 Prompt 结构，便于在多场景、多语言、多模型间切换；LangChain、Jinja2 等都内置此机制。"},
  {id:"Prompt Injection", zh:"提示注入", cat:"engineering", size:2, desc:"Prompt Injection。攻击者把恶意指令藏在用户输入或工具返回中，让 Agent 执行非预期操作，是 LLM 应用的头号安全风险类型。"},
  {id:"Guardrail", zh:"护栏", cat:"engineering", size:3, desc:"Guardrail。在 Agent 输入输出链路上加装的安全与合规检查层，负责拦截恶意 Prompt、过滤敏感内容、约束工具调用范围，是企业级落地标配。"},
  {id:"Context", zh:"上下文", cat:"engineering", size:4, desc:"Context。模型本轮可见的全部文本（系统提示、历史对话、工具结果、RAG 片段），Context Engineering 决定 Agent 输出上限与稳定性。"},
  {id:"Harness", zh:"运行环境", cat:"engineering", size:2, desc:"Harness。承载 Agent 的运行环境与基础设施（终端、IDE、浏览器、沙盒），决定 Agent 能做什么、能看见什么、能影响多大范围。"},
  {id:"Skill", zh:"Skill 技能", cat:"engineering", size:1, desc:"Skill。可被 Agent 加载的结构化『做法手册』如 SKILL.md，把经验沉淀成可复用的流程，让 Agent 在新任务上零成本继承历史经验。"},
  {id:"Plugin", zh:"插件", cat:"engineering", size:2, desc:"Plugin。可热插拔的功能扩展模块，用户按需启用，丰富 Agent 能力；常封装一组 Tool，是工具生态分发与权限管控的常见单元。"},
  {id:"Connector", zh:"连接器", cat:"engineering", size:3, desc:"Connector。把 Agent 与外部 SaaS（钉钉、飞书、Notion、Slack 等）连通的标准化适配层，统一鉴权与数据格式，是企业集成的关键组件。"},
  {id:"Adapter", zh:"适配器", cat:"engineering", size:2, desc:"Adapter。把不同模型或工具的差异封装成统一接口，方便上层无侵入切换底座；是多模型路由与跨厂商迁移的关键中间件。"},
  {id:"Hooks", zh:"钩子", cat:"engineering", size:2, desc:"Hooks。在特定事件点（如工具调用前后、消息生成前后）注入自定义逻辑，用于日志、权限、安全审查、计费等横切关注点。"},
  {id:"RAG", zh:"检索增强生成", cat:"engineering", size:5, desc:"Retrieval-Augmented Generation。先检索相关文档再让模型基于检索结果作答，是缓解幻觉、外接私有知识、保持回答可溯源的主流方案。"},
  {id:"Vector Database", zh:"向量数据库", cat:"engineering", size:3, desc:"Vector Database。存储与检索 Embedding 向量的数据库，支持 ANN 近邻查询；Milvus、Pinecone、Qdrant、PGVector 是常用产品。"},
  {id:"Sandbox", zh:"沙盒环境", cat:"engineering", size:1, desc:"Sandbox。隔离的执行环境（容器、虚拟机、WASM 运行时），让 Agent 安全执行未知代码或命令，是 Code Interpreter 与自动化关键。"},
  {id:"Deployment", zh:"部署", cat:"engineering", size:3, desc:"Deployment。把 Agent、模型服务上线到生产环境的过程，涵盖打包、灰度发布、版本回滚、监控告警，是工程化的最后一公里。"},
  {id:"Redis", zh:"Redis", cat:"engineering", size:1, desc:"Redis。高性能内存键值数据库，Agent 中常用于会话状态缓存、限流计数、向量缓存、消息队列与短期记忆存储。"},
  {id:"JavaScript", zh:"JavaScript", cat:"engineering", size:2, desc:"JavaScript。浏览器与服务端通用的脚本语言，AG-UI、Agent Web UI、浏览器自动化、可视化都依赖 JS，也是大量 Agent SDK 的实现语言。"},
  {id:"Node.js", zh:"Node.js", cat:"engineering", size:3, desc:"Node.js。基于 V8 的 JavaScript 服务端运行时，MCP Server、TS/JS SDK、Agent Web 后端常用 Node 作为部署底座，生态包丰富。"},

  /* ========== 搜索技术 Search ========== */
  {id:"Query", zh:"查询", cat:"search", size:2, desc:"Query。用户或 Agent 发起检索的关键词或自然语言；Query 理解（改写、扩展、纠错、意图识别）的好坏直接决定搜索质量。"},
  {id:"Recall", zh:"召回", cat:"search", size:1, desc:"Recall。搜索与推荐的第一阶段，从海量候选中快速捞出可能相关的子集；常用倒排、向量、规则多路召回并集，追求高覆盖。"},
  {id:"Ranking", zh:"排序", cat:"search", size:1, desc:"Ranking。召回后的精排阶段，用复杂模型（GBDT、Wide&Deep、Cross-Encoder）对候选打分排序，决定最终用户看到的顺序与体验。"},
  {id:"Index/Retrieval", zh:"索引与检索", cat:"search", size:4, desc:"Index/Retrieval。信息检索的两个阶段：离线建索引（拆词、倒排、向量化）+ 在线检索召回相关文档，是搜索系统的核心骨架。"},
  {id:"Inverted Index", zh:"倒排链", cat:"search", size:1, desc:"Inverted Index。词到文档列表的索引结构，是关键词检索能在毫秒内返回结果的关键数据结构，几乎所有搜索引擎都以此为底。"},
  {id:"Trie", zh:"字典树", cat:"search", size:1, desc:"Trie。按字符前缀组织的树形数据结构，常用于自动补全、敏感词匹配、IP 路由表、Query 改写等前缀敏感场景。"},
  {id:"TF/DF", zh:"词频/文档频次", cat:"search", size:1, desc:"TF/DF。TF 是词在文档中出现的频率，DF 是出现该词的文档数；组合成 TF-IDF 衡量词的重要性，是早期搜索相关性的基础信号。"},
  {id:"BM25", zh:"BM25 算法", cat:"search", size:3, desc:"BM25。基于概率的经典文本相关性打分函数，几乎是关键词搜索的事实基线，至今仍是 RAG 系统第一道召回的标配。"},
  {id:"SQL", zh:"SQL", cat:"search", size:1, desc:"SQL。结构化查询语言，与搜索的非结构化检索互补；Agent 经常需要在 SQL 查询与全文搜索之间做意图路由与结果融合。"},
  {id:"Ha3", zh:"Ha3 搜索引擎", cat:"search", size:1, desc:"Ha3。阿里自研搜索引擎，淘宝、支付宝等核心业务搜索的底层，支持倒排、向量、复杂排序插件与超大规模索引服务。"},
  {id:"Vector Search", zh:"向量检索", cat:"search", size:2, desc:"Vector Search。用 Embedding 距离做相似度检索，能召回语义相近但字面不同的内容，是 RAG 与语义搜索的核心召回方式。"},
  {id:"Semantic Search", zh:"语义搜索", cat:"search", size:3, desc:"Semantic Search。理解 Query 与文档真实语义后做相关性匹配的搜索范式，依赖 Embedding、向量检索与 Cross-Encoder 重排，是新一代搜索能力。"},
  {id:"Dense Retrieval", zh:"稠密检索", cat:"search", size:1, desc:"Dense Retrieval。用稠密向量 Embedding 做检索，对应稀疏检索 BM25、TF-IDF，常与稀疏检索混合使用以兼顾召回精度与语义。"},
  {id:"Sparse Retrieval", zh:"稀疏检索", cat:"search", size:1, desc:"Sparse Retrieval。基于词袋与倒排索引的关键词检索如 BM25，向量稀疏、计算便宜、精确匹配能力强，是混合检索的稳健底盘。"},
  {id:"Hybrid Search", zh:"混合检索", cat:"search", size:1, desc:"Hybrid Search。同时使用稀疏 BM25 与稠密向量召回并融合排序如 RRF，兼顾精确匹配与语义召回，是工业级 RAG 的事实标配。"},
  {id:"Reranker", zh:"重排器", cat:"search", size:2, desc:"Reranker。在召回之后用更强模型 Cross-Encoder 对候选重打分，显著提升 RAG 与搜索 Top-K 精度，是高质量检索的最后一道把关。"}
];

  n.label = (n.id === n.zh) ? n.id : `${n.id} · ${n.zh}`;
});

const svg = d3.select("#graph svg");
const width = window.innerWidth;
const height = window.innerHeight;

document.getElementById("cnt-n").textContent = NODES.length;
document.getElementById("cnt-e").textContent = LINKS.length;

const g = svg.append("g");
const linkG = g.append("g").attr("class","links");
const nodeG = g.append("g").attr("class","nodes");

svg.call(d3.zoom().scaleExtent([0.15,3]).on("zoom",ev=>g.attr("transform",ev.transform)));

const radiusOf = s => s>=5 ? 32 : s===4 ? 22 : 13; // 3 档面积：仅头部 10 节点最大，次级 ~18 中号，其余小号

const linkData = LINKS.map(([s,t])=>({source:s,target:t}));

const sim = d3.forceSimulation(NODES)
  .force("link", d3.forceLink(linkData).id(d=>d.id).distance(d=>{
     return 80 + (d.source.size + d.target.size)*7;
  }).strength(0.55))
  .force("charge", d3.forceManyBody().strength(d=>-140 - d.size*70))
  .force("center", d3.forceCenter(width/2, height/2))
  .force("collide", d3.forceCollide().radius(d=>radiusOf(d.size)+10))
  .force("x", d3.forceX(width/2).strength(0.025))
  .force("y", d3.forceY(height/2).strength(0.025));

const linkSel = linkG.selectAll("line")
  .data(linkData).enter().append("line")
  .attr("class","link")
  .attr("stroke-width",1);

const nodeSel = nodeG.selectAll("g.node")
  .data(NODES).enter().append("g")
  .attr("class",d=>"node " + (d.size>=5?"huge":d.size>=4?"large":""))
  .call(d3.drag()
    .on("start",(ev,d)=>{if(!ev.active) sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
    .on("drag",(ev,d)=>{d.fx=ev.x;d.fy=ev.y})
    .on("end",(ev,d)=>{if(!ev.active) sim.alphaTarget(0);d.fx=null;d.fy=null}))
  .on("click",(ev,d)=>{ev.stopPropagation();selectNode(d.id)});

nodeSel.append("circle")
  .attr("r",d=>radiusOf(d.size))
  .attr("fill",d=>CATEGORIES[d.cat].color);

nodeSel.append("text")
  .attr("dy",d=>radiusOf(d.size)+12)
  .attr("text-anchor","middle")
  .text(d=>d.label);

sim.on("tick",()=>{
  linkSel
    .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
    .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
});

/* 图例（混合聚焦模式）
   - 默认：所有分类启用（focused=false），全显
   - 单击 chip：进入聚焦，只显示该分类
   - 再单击当前唯一激活的 chip：退出聚焦回到全显
   - Shift + 单击：在已聚焦集合上多选追加 / 移除
   - 单击 SVG 空白：退出聚焦
*/
const legendEl = document.getElementById("legend");
const allCats = Object.keys(CATEGORIES);
let focused = false;                          // 是否处于聚焦模式
const enabledCats = new Set(allCats);         // 当前可见分类

function syncChips(){
  legendEl.querySelectorAll(".chip").forEach(chip=>{
    const k = chip.dataset.cat;
    if(!focused || enabledCats.has(k)){chip.classList.remove("off")}
    else{chip.classList.add("off")}
  });
}
function applyCatFilter(){
  // 聚焦模式：命中分类正常显示，未命中变低透明度（.dim）
  // 未聚焦：全部恢复正常
  // 注意：用 style 清空避免与节点 hover/select 的 dim 类冲突
  nodeSel.style("display", null);
  linkSel.style("display", null);
  if(!focused){
    nodeSel.classed("dim", false);
    linkSel.classed("dim", false).classed("hi", false);
  }else{
    nodeSel.classed("dim", d=>!enabledCats.has(d.cat));
    linkSel.classed("dim", d=>!(enabledCats.has(d.source.cat)&&enabledCats.has(d.target.cat)))
           .classed("hi",  d=>  enabledCats.has(d.source.cat)&&enabledCats.has(d.target.cat));
  }
  syncChips();
}
function resetCats(){
  focused = false;
  enabledCats.clear();
  allCats.forEach(k=>enabledCats.add(k));
  applyCatFilter();
}

Object.entries(CATEGORIES).forEach(([k,v])=>{
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.dataset.cat = k;
  chip.innerHTML = `<span class="dot" style="background:${v.color}"></span>${v.label}`;
  chip.onclick = (ev)=>{
    if(ev.shiftKey){
      // Shift+ 多选：在聚焦集合上追加/移除
      if(!focused){
        focused = true;
        enabledCats.clear();
        enabledCats.add(k);
      }else{
        if(enabledCats.has(k)){
          enabledCats.delete(k);
          if(enabledCats.size===0) focused = false;   // 全删则退回全显
          if(!focused) allCats.forEach(c=>enabledCats.add(c));
        }else{
          enabledCats.add(k);
        }
      }
    }else{
      // 单击：进入聚焦该分类 / 或退出聚焦
      if(focused && enabledCats.size===1 && enabledCats.has(k)){
        resetCats(); return;
      }
      focused = true;
      enabledCats.clear();
      enabledCats.add(k);
    }
    applyCatFilter();
  };
  legendEl.appendChild(chip);
});

/* 邻接 + 选中 */
const adjacency = {};
NODES.forEach(n=>adjacency[n.id]=new Set());
LINKS.forEach(([s,t])=>{

  adjacency[s].add(t);adjacency[t].add(s);
});

function selectNode(id){
  const node = NODES.find(n=>n.id===id);
  if(!node) return;
  nodeSel.classed("selected",d=>d.id===id)
         .classed("dim", d=>d.id!==id && !adjacency[id].has(d.id));
  linkSel.classed("hi", d=>d.source.id===id||d.target.id===id)
         .classed("dim", d=>!(d.source.id===id||d.target.id===id));
  renderSidebar(node);
}

  linkSel.classed("hi",false).classed("dim",false);
  document.getElementById("sidebar-empty").style.display="";
  document.getElementById("sidebar-content").style.display="none";

/* ============ 知识库统一存储：library 模型（base + user） ============ */
const LS_LIB_USER = "kg.libUserArticles.v2";   // [{id,title,url,abstract,tags,addedAt}]
const LS_LIB_DEL  = "kg.libDeletedIds.v2";     // ["art-000",...]
function loadLS(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveLS(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function loadLibUser(){ return loadLS(LS_LIB_USER, []); }
function saveLibUser(arr){ saveLS(LS_LIB_USER, arr); }
function loadDeletedIds(){ return new Set(loadLS(LS_LIB_DEL, [])); }
function saveDeletedIds(set){ saveLS(LS_LIB_DEL, [...set]); }

function keyOf(url){
  if(!url) return "";
  return String(url).trim().replace(/#.*$/,"").replace(/\/+$/,"");
}

function getAllLibraryArticles(){
  const userLib = loadLibUser();
  const deletedIds = loadDeletedIds();
  const base = RELATED_ARTICLES.articles
    .filter(a => !deletedIds.has(a.id))
    .map(a => Object.assign({}, a, {src:"base"}));
  const user = userLib.map(a => Object.assign({}, a, {src:"user"}));
  // user 加在前面，最新加入的排最前
  return [...user, ...base];
}

/* Tab1 侧栏：当前节点关联到的所有文章（来自 library，按 tags 命中） */
function getArticlesForNode(nodeId){
  const out = [];
  const seen = new Set();
  const lib = getAllLibraryArticles();
  // 1) 先取按 tag 命中的 library 文章
  lib.forEach(a => {
    if(!a.tags || !a.tags.includes(nodeId)) return;
    const k = keyOf(a.url);
    if(seen.has(k)) return;
    seen.add(k);
    // 优先用 by_node 里的精排摘要（按文章 id 而非 ai 索引来匹配）
    let snippet = "";
    const entries = RELATED_ARTICLES.by_node[nodeId] || [];
    for(const e of entries){
      const baseArt = RELATED_ARTICLES.articles[e.ai];
      if(baseArt && baseArt.id === a.id){ snippet = e.ab || ""; break; }
    }
    out.push({
      title: a.title,
      url: a.url,
      abstract: snippet || a.abstract || "",
      src: a.src,
      id: a.id
    });
  });
  return out;
}

function renderArticles(nodeId){
  const list = document.getElementById("articles-list");
  const labelEl = document.getElementById("articles-label");
  if(!list) return;
  const items = getArticlesForNode(nodeId);
  if(labelEl) labelEl.textContent = `相关文章 ARTICLES${items.length?` · ${items.length}`:""}`;
  list.innerHTML = "";
  items.forEach(a=>{
    const card = document.createElement("a");
    card.className = "article-card";
    card.href = a.url;
    card.target = "_blank";
    card.rel = "noopener noreferrer";
    card.title = a.title;
    card.innerHTML = `
      <button type="button" class="del-btn" title="从知识库中移除此文章">×</button>
      <div class="a-title">${escapeHtml(a.title)}</div>
      <div class="a-abs">${escapeHtml(a.abstract||"")}</div>
      <div class="a-link">↗ 阅读原文${a.src==="user"?" · 我添加":""}</div>
    `;
    card.querySelector(".del-btn").onclick = (ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      if(!confirm("从知识库中移除此文章？\n（也会从「文章库」标签页消失）")) return;
      deleteLibraryArticleById(a.id);
      renderArticles(nodeId);
      if(typeof renderLibrary === "function") renderLibrary();
    };
    list.appendChild(card);
  });
}

function deleteLibraryArticleById(id){
  if(!id) return;
  if(id.startsWith && id.startsWith("art-")){
    const del = loadDeletedIds();
    del.add(id); saveDeletedIds(del);
  } else {
    saveLibUser(loadLibUser().filter(a => a.id !== id));
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function wireArticleControls(nodeId){
  const btn = document.getElementById("add-article-btn");
  if(!btn) return;
  btn.onclick = ()=>{
    if(typeof openLibAddModal === "function") openLibAddModal(nodeId);
  };
}

async function fetchArticleMeta(url){
  // 走 r.jina.ai 反向代理（无需 key），返回带 Title/Description/URL Source 头的 markdown
  const proxied = "https://r.jina.ai/" + url;
  const resp = await fetch(proxied, {headers:{"Accept":"text/plain"}});
  if(!resp.ok) throw new Error("HTTP " + resp.status);
  const text = await resp.text();
  if(!text || text.length < 20) throw new Error("空响应");

  // 检测公众号失效页 / 删除页特征词
  const deadMarkers = ["环境异常","该内容已被","已被发布者删除","违规无法查看","Account has been blocked"];
  for(const m of deadMarkers){
    if(text.includes(m)) throw new Error("目标页已失效或被删除");
  }

  // 解析头部元数据
  const m = {};
  const headerEnd = text.indexOf("\n\n");
  const headerBlock = headerEnd>0 ? text.slice(0, headerEnd) : text.slice(0, 600);
  const reLine = /^(Title|Description|URL Source|Published Time):\s*(.+)$/gmi;
  let mm;
  while((mm = reLine.exec(headerBlock)) !== null){
    m[mm[1].toLowerCase()] = mm[2].trim();
  }
  const title = (m["title"]||"").replace(/\s+/g," ").trim();
  let abstract = (m["description"]||"").replace(/\s+/g," ").trim();
  const finalUrl = m["url source"] || url;

  // 若 description 缺失或过短，从正文首段截 40-60 字
  if(!abstract || abstract.length < 25){
    const body = headerEnd>0 ? text.slice(headerEnd).trim() : text;
    // 去掉 markdown 图片/链接/标题/列表标记
    const paras = body.split(/\n{2,}/)
      .map(p=>p.replace(/^#+\s*/,"").replace(/!\[[^\]]*\]\([^)]+\)/g,"").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/^[>\-\*\d\.\s]+/,"").replace(/\s+/g," ").trim())
      .filter(p=>p.length>=20);
    abstract = paras[0] || abstract || "";
  }
  // 控制 40-60 字（按 Unicode 码点）
  const chars = [...abstract];
  if(chars.length > 60) abstract = chars.slice(0,58).join("") + "…";

  return {title: title || finalUrl, abstract, url: finalUrl};
}

/* ============ Tab2 文章库渲染 ============ */
let libTagFilter = null;        // null = 全部
let libSearchTerm = "";

function _libHost(url){
  try{ return new URL(url).hostname.replace(/^www\./,""); }catch(e){ return ""; }
}

function renderLibrary(){
  const all = getAllLibraryArticles();

  // 标签计数
  const tagCounts = {};
  all.forEach(a => (a.tags||[]).forEach(t => { tagCounts[t] = (tagCounts[t]||0) + 1; }));
  const sortedTags = Object.keys(tagCounts).sort((a,b)=>tagCounts[b]-tagCounts[a] || a.localeCompare(b));

  // 标签栏
  const tagbar = document.getElementById("lib-tagbar");
  tagbar.innerHTML =
    `<div class="tag-chip ${libTagFilter===null?'on':''}" data-tag="">全部 <span class="cnt">${all.length}</span></div>` +
    sortedTags.map(t =>
      `<div class="tag-chip ${libTagFilter===t?'on':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)} <span class="cnt">${tagCounts[t]}</span></div>`
    ).join("");
  tagbar.querySelectorAll(".tag-chip").forEach(c=>{
    c.onclick = () => { libTagFilter = c.dataset.tag || null; renderLibrary(); };
  });

  // 过滤
  const term = (libSearchTerm||"").toLowerCase().trim();
  const filtered = all.filter(a => {
    if(libTagFilter && !(a.tags||[]).includes(libTagFilter)) return false;
    if(term){
      const blob = (a.title + " " + (a.abstract||"") + " " + (a.tags||[]).join(" ")).toLowerCase();
      if(!blob.includes(term)) return false;
    }
    return true;
  });

  const cntEl = document.getElementById("lib-count");
  if(cntEl) cntEl.textContent = `共 ${filtered.length} 篇${libTagFilter?` · 筛选「${libTagFilter}」`:""}`;

  const grid = document.getElementById("lib-grid");
  if(filtered.length === 0){
    grid.innerHTML = `<div class="lib-empty">没有匹配的文章<br/>试试切换标签或清空搜索</div>`;
    return;
  }
  grid.innerHTML = filtered.map(a => {
    const host = _libHost(a.url);
    const tagsHTML = (a.tags||[]).slice(0,10).map(t =>
      `<span class="lc-tag" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`
    ).join("");
    return `
      <div class="lib-card" data-id="${escapeHtml(a.id)}">
        <button class="lc-del" type="button" title="删除此文章">×</button>
        <a class="lc-title" href="${a.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(a.title)}</a>
        <div class="lc-abs">${escapeHtml(a.abstract||"")}</div>
        <div class="lc-tags">${tagsHTML}</div>
        <div class="lc-meta">
          <span class="lc-host" title="${escapeHtml(a.url)}">${escapeHtml(host)}</span>
          ${a.src==="user"?'<span class="lc-user">· 我添加</span>':''}
        </div>
      </div>
    `;
  }).join("");

  // 卡片交互
  grid.querySelectorAll(".lib-card").forEach(card => {
    const id = card.dataset.id;
    card.querySelector(".lc-del").onclick = (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      if(!confirm("从知识库中删除此文章？")) return;
      deleteLibraryArticleById(id);
      renderLibrary();
      // 若图谱侧栏正在展示，同步刷新
      const c = document.getElementById("sidebar-content");
      if(c && c.style.display !== "none"){
        const h2 = c.querySelector("h2");
        if(h2){ renderArticles(h2.textContent.trim()); }
      }
    };
    card.querySelectorAll(".lc-tag").forEach(t => {
      t.onclick = (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        // 点标签：1) 在 Tab2 内置筛选 2) 同时支持双击跳到图谱选中该节点（简化为单击切到图谱）
        libTagFilter = t.dataset.tag; renderLibrary();
      };
    });
    // 双击 lc-tag 跳到图谱
    card.querySelectorAll(".lc-tag").forEach(t => {
      t.addEventListener("dblclick", (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        const tag = t.dataset.tag;
        document.querySelector('#tabbar button[data-tab="graph"]').click();
        setTimeout(()=>{ if(typeof selectNode==="function") selectNode(tag); }, 60);
      });
    });
  });
}

const libSearchInput = document.getElementById("lib-search");
if(libSearchInput){
  libSearchInput.addEventListener("input", e => {
    libSearchTerm = e.target.value;
    renderLibrary();
  });
}

/* ============ Tab2 添加文章 Modal ============ */
function openLibAddModal(prefillTagId){
  const modal = document.getElementById("lib-add-modal");
  modal.classList.add("show");
  document.getElementById("lib-add-url").value = "";
  document.getElementById("lib-add-tit").value = "";
  document.getElementById("lib-add-abs").value = "";
  document.getElementById("lib-add-tagq").value = "";
  setLibStatus("", false);
  // 标签选择器
  const allNodeIds = NODES.map(n=>n.id).sort();
  const selected = new Set(prefillTagId ? [prefillTagId] : []);
  const picker = document.getElementById("lib-add-tagpicker");
  const renderPicker = (filter)=>{
    const f = (filter||"").toLowerCase().trim();
    picker.innerHTML = allNodeIds
      .filter(t => !f || t.toLowerCase().includes(f))
      .map(t => `<span class="tp-chip ${selected.has(t)?'on':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join("");
    picker.querySelectorAll(".tp-chip").forEach(c => {
      c.onclick = () => {
        const t = c.dataset.tag;
        if(selected.has(t)){ selected.delete(t); c.classList.remove("on"); }
        else {
          if(selected.size >= 10){ setLibStatus("最多 10 个标签", true); return; }
          selected.add(t); c.classList.add("on");
          setLibStatus("", false);
        }
        updateTagCnt();
      };
    });
  };
  const updateTagCnt = () => {
    const el = document.getElementById("lib-add-tagcnt");
    if(el) el.textContent = `（已选 ${selected.size} / 10）`;
  };
  renderPicker("");
  updateTagCnt();
  document.getElementById("lib-add-tagq").oninput = (e)=>renderPicker(e.target.value);

  document.getElementById("lib-add-cancel").onclick = closeLibAddModal;
  document.getElementById("lib-add-fetch").onclick = async () => {
    const url = document.getElementById("lib-add-url").value.trim();
    if(!url){ setLibStatus("先填链接再抓取", true); return; }
    if(!/^https?:\/\//i.test(url)){ setLibStatus("链接需以 http:// 或 https:// 开头", true); return; }
    setLibStatus("正在抓取标题与摘要…", false);
    try{
      const meta = await fetchArticleMeta(url);
      if(meta.title && !document.getElementById("lib-add-tit").value) document.getElementById("lib-add-tit").value = meta.title;
      if(meta.abstract && !document.getElementById("lib-add-abs").value) document.getElementById("lib-add-abs").value = meta.abstract;
      setLibStatus("抓取完成，已填充", false);
    } catch(err){
      setLibStatus("抓取失败：" + (err && err.message || err) + "（可手动填写）", true);
    }
  };

  const submitBtn = document.getElementById("lib-add-submit");
  submitBtn.disabled = false;
  submitBtn.onclick = async () => {
    let url = document.getElementById("lib-add-url").value.trim();
    let title = document.getElementById("lib-add-tit").value.trim();
    let abstract = document.getElementById("lib-add-abs").value.trim();
    const tags = [...selected];
    if(!url){ setLibStatus("请输入链接", true); return; }
    if(!/^https?:\/\//i.test(url)){ setLibStatus("链接需以 http:// 或 https:// 开头", true); return; }
    if(tags.length === 0){ setLibStatus("至少选 1 个标签", true); return; }
    if(tags.length > 10){ setLibStatus("最多 10 个标签", true); return; }
    const k = keyOf(url);
    const all = getAllLibraryArticles();
    if(all.some(a => keyOf(a.url) === k)){ setLibStatus("此链接已存在", true); return; }
    submitBtn.disabled = true;
    // 缺标题/摘要时尝试抓取
    if(!title || !abstract){
      setLibStatus("正在抓取标题与摘要…", false);
      try{
        const meta = await fetchArticleMeta(url);
        if(!title) title = meta.title || url;
        if(!abstract) abstract = meta.abstract || "";
      } catch(err){
        setLibStatus("抓取失败：" + (err && err.message || err) + "；请手动填写标题与摘要", true);
        submitBtn.disabled = false;
        return;
      }
    }
    if(!title) title = url;
    // 摘要长度控制：超 150 字裁剪
    const arr = [...abstract];
    if(arr.length > 150) abstract = arr.slice(0, 148).join("") + "…";

    const newId = "user-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6);
    const userLib = loadLibUser();
    userLib.unshift({id:newId, title, url, abstract, tags, addedAt: Date.now()});
    saveLibUser(userLib);
    closeLibAddModal();
    renderLibrary();
    // 若图谱侧栏正在展示某节点，刷新
    const c = document.getElementById("sidebar-content");
    if(c && c.style.display !== "none"){
      const h2 = c.querySelector("h2");
      if(h2){ renderArticles(h2.textContent.trim()); }
    }
  };
}
function setLibStatus(msg, isErr){
  const s = document.getElementById("lib-add-status");
  if(!s) return;
  s.textContent = msg || "";
  s.classList.toggle("err", !!isErr);
}
function closeLibAddModal(){
  document.getElementById("lib-add-modal").classList.remove("show");
}
// ESC 关闭 modal
document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){
    const m = document.getElementById("lib-add-modal");
    if(m && m.classList.contains("show")) closeLibAddModal();
  }
});
// 顶栏的「＋ 添加文章」按钮
const libAddTopBtn = document.getElementById("lib-add-btn");
if(libAddTopBtn){
  libAddTopBtn.onclick = ()=>openLibAddModal(null);
}
// 点击 modal 背景关闭
const libModalEl = document.getElementById("lib-add-modal");
if(libModalEl){
  libModalEl.addEventListener("click", (e)=>{ if(e.target === libModalEl) closeLibAddModal(); });
}

/* 搜索：英文/中文/描述均可命中 */
document.getElementById("search").addEventListener("input",e=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){clearSelection();return}
  nodeSel.classed("dim",d=>!(
    d.id.toLowerCase().includes(q) ||
    d.zh.toLowerCase().includes(q) ||
    d.desc.toLowerCase().includes(q)
  ));
  linkSel.classed("dim",true);
});
document.getElementById("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const q = e.target.value.trim().toLowerCase();
    const hit = NODES.find(n=>
      n.id.toLowerCase()===q || n.zh.toLowerCase()===q ||
      n.id.toLowerCase().includes(q) || n.zh.toLowerCase().includes(q)
    );
    if(hit) selectNode(hit.id);
  }
});

window.addEventListener("resize",()=>{
  sim.force("center", d3.forceCenter(window.innerWidth/2, window.innerHeight/2));
  sim.alpha(.3).restart();
});
</script>
